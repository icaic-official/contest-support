<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Minsky · B · Ops board</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<script>tailwind.config = { theme: { extend: { fontFamily: { sans: ["Space Grotesk", "sans-serif"], mono: ["IBM Plex Mono", "monospace"] } } } };</script>
<style>
  body { background: radial-gradient(1200px 600px at 10% -10%, #1e293b 0%, transparent 60%), radial-gradient(900px 500px at 110% 10%, #172554 0%, transparent 55%), #070b14; }
  [data-lucide] { width: 16px; height: 16px; }
  .glass { background: rgb(15 23 42 / .55); border: 1px solid rgb(148 163 184 / .12); backdrop-filter: blur(12px); }
  .lane { background: rgb(15 23 42 / .35); border: 1px solid rgb(148 163 184 / .08); }
  .card { background: linear-gradient(180deg, rgb(30 41 59 / .9), rgb(15 23 42 / .9)); border: 1px solid rgb(148 163 184 / .14); transition: transform .15s, border-color .15s; }
  .card:hover { transform: translateY(-2px); border-color: rgb(148 163 184 / .35); }
  .card.crit { border-color: rgb(244 63 94 / .55); box-shadow: 0 0 0 1px rgb(244 63 94 / .15), 0 8px 30px -10px rgb(244 63 94 / .5); }
  .card.warn { border-color: rgb(245 158 11 / .4); }
  .bar { height: 3px; border-radius: 9999px; background: rgb(148 163 184 / .15); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 9999px; }
  .pin { transition: transform .15s; } .pin:hover { transform: scale(1.12); }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 rgb(244 63 94 / .6); } 100% { box-shadow: 0 0 0 14px rgb(244 63 94 / 0); } }
  .ring-pulse { animation: ring 1.6s infinite; }
  .seg[aria-pressed="true"] { background: rgb(148 163 184 / .15); color: white; }
  .tv .tv-hide { display: none; } .tv .tv-big { font-size: 1.25rem; }
</style>
</head>
<body class="text-slate-200 font-sans min-h-screen">
<div class="max-w-[1500px] mx-auto px-6 py-5" id="root">
  <header class="flex items-center gap-4 flex-wrap">
    <div class="flex items-center gap-3"><div class="size-9 rounded-xl bg-gradient-to-br from-sky-400 to-indigo-600 grid place-items-center font-bold text-white shadow-lg shadow-indigo-900/50">M</div><div><div class="text-sm text-slate-400 leading-none">Northern Informatics Open 2026</div><div class="font-semibold text-white mt-1">Finals · Contest day</div></div></div>
    <div class="flex items-center rounded-xl glass p-1 text-sm ml-2">
      <button class="seg px-3 h-8 rounded-lg flex items-center gap-2 text-slate-400" data-view="board" aria-pressed="true"><i data-lucide="columns-3"></i>Board</button>
      <button class="seg px-3 h-8 rounded-lg flex items-center gap-2 text-slate-400" data-view="floor"><i data-lucide="map"></i>Floor</button>
      <button class="seg px-3 h-8 rounded-lg flex items-center gap-2 text-slate-400" data-view="awards"><i data-lucide="scale"></i>Awards</button>
    </div>
    <div class="flex-1"></div>
    <div class="glass rounded-xl px-3 h-10 flex items-center gap-2 text-sm text-slate-400 w-60 tv-hide"><i data-lucide="search"></i><input id="q" class="bg-transparent outline-none flex-1 text-slate-200 placeholder:text-slate-500" placeholder="Filter by team or table — “hall b”" /></div>
    <div class="glass rounded-xl px-3 h-10 flex items-center gap-2 text-sm"><span class="size-2 rounded-full bg-emerald-400 shadow-[0_0_10px] shadow-emerald-400"></span>Live<span class="font-mono text-slate-400 ml-1" id="clock"></span></div>
    <button class="glass rounded-xl px-3 h-10 flex items-center gap-2 text-sm hover:text-white" id="tv"><i data-lucide="tv"></i><span class="tv-hide">Wall mode</span></button>
    <button class="rounded-xl px-4 h-10 flex items-center gap-2 text-sm font-semibold bg-sky-400 text-slate-950 hover:bg-sky-300 tv-hide"><i data-lucide="plus"></i>Report</button>
  </header>

  <section class="grid grid-cols-2 lg:grid-cols-5 gap-3 mt-6" id="kpis"></section>
  <section class="mt-6" id="view"></section>
</div>

<div id="focus" class="fixed inset-0 z-50 hidden"><div class="absolute inset-0 bg-slate-950/70 backdrop-blur-sm" data-close></div><div class="relative mx-auto my-[5vh] max-w-5xl h-[90vh] rounded-2xl glass !bg-slate-900/95 overflow-hidden flex flex-col" id="focus-body"></div></div>

<script>
// Fictional sample data shared by every mockup. Times are relative to page load.
const NOW0 = Date.now();
const ago = (m) => new Date(NOW0 - m * 60000).toISOString();
const DATA = {
  event: { name: "Northern Informatics Open 2026", archived: false },
  sessions: ["Finals · Contest day", "Finals · Practice round"],
  session: { name: "Finals · Contest day", intake_open: true, categories: ["Workstation", "Network", "Judge system", "Problem statement", "Printing", "Other"], max_image_mb: 8, max_images: 6, max_total_mb: 30 },
  me: { name: "Priya Raman", initials: "PR", roles: ["volunteer", "specialist"], admin: true },
  teams: [
    { id: "t1", name: "Team Aurora", location: "Hall A · Table 4", x: 1, y: 1 },
    { id: "t2", name: "Byte Bandits", location: "Hall A · Table 7", x: 4, y: 1 },
    { id: "t3", name: "Null Pointers", location: "Hall A · Table 12", x: 3, y: 3 },
    { id: "t4", name: "Segfault Society", location: "Hall B · Table 2", x: 7, y: 1 },
    { id: "t5", name: "Off By One", location: "Hall B · Table 9", x: 8, y: 3 },
    { id: "t6", name: "Café Lambda", location: "Hall B · Table 15", x: 6, y: 4 },
    { id: "t7", name: "Greedy Goblins", location: "Hall A · Table 18", x: 1, y: 4 },
    { id: "t8", name: "Heap Heroes", location: "Hall B · Table 21", x: 9, y: 5 },
    { id: "t9", name: "Recursive Rabbits", location: "Hall A · Table 22", x: 4, y: 5 },
  ],
  people: { "Priya Raman": "PR", "Marcus Lee": "ML", "Sofia Ortega": "SO", "Dev Patel": "DP", "Hana Kim": "HK" },
  issues: [
    { id: "i31", number: 31, team: "t3", category: "Workstation", description: "Keyboard stopped responding after the IDE froze. Mouse still works.", status: "open", created: 2.2, first: null, owner: null, reporter: "Null Pointers" },
    { id: "i30", number: 30, team: "t5", category: "Judge system", description: "Submission stuck on “Judging” for problem C for over ten minutes.", status: "escalated", created: 14.5, first: 12.9, owner: "Marcus Lee", reporter: "Off By One" },
    { id: "i29", number: 29, team: "t1", category: "Network", description: "Cannot reach the contest site. Browser shows a connection reset.", status: "claimed", created: 9.1, first: 7.4, owner: "Priya Raman", reporter: "Team Aurora" },
    { id: "i28", number: 28, team: "t6", category: "Printing", description: "Print request from 10:42 never arrived at our table.", status: "claimed", created: 23.8, first: 21.0, owner: "Sofia Ortega", reporter: "Café Lambda" },
    { id: "i27", number: 27, team: "t2", category: "Problem statement", description: "Sample output for problem E contradicts the constraints in section 2.", status: "open", created: 5.6, first: null, owner: null, reporter: "Dev Patel" },
    { id: "i26", number: 26, team: "t4", category: "Workstation", description: "Monitor flickers and goes black every few minutes.", status: "resolved", created: 48, first: 46.5, owner: "Priya Raman", reporter: "Segfault Society", resolved: 31, award: { minutes: 10, explanation: "Workstation replaced; 17 minutes lost.", by: "Hana Kim", at: 25, applied: null } },
    { id: "i25", number: 25, team: "t7", category: "Network", description: "Intermittent packet loss when submitting large files.", status: "resolved", created: 72, first: 70, owner: "Marcus Lee", reporter: "Greedy Goblins", resolved: 52, award: { minutes: 5, explanation: "Brief outage confirmed by network team.", by: "Hana Kim", at: 44, applied: { by: "Dev Patel", at: 40 } } },
    { id: "i24", number: 24, team: "t8", category: "Other", description: "Chair is broken and the table is wobbling.", status: "resolved", created: 95, first: 93, owner: "Sofia Ortega", reporter: "Heap Heroes", resolved: 88 },
    { id: "i23", number: 23, team: "t9", category: "Judge system", description: "Scoreboard shows our accepted solution as wrong answer.", status: "claimed", created: 31, first: 29.5, owner: "Marcus Lee", reporter: "Recursive Rabbits", reopened: true },
  ],
  history: {
    i31: [{ t: "event", text: "Submitted by Null Pointers", at: 2.2 }],
    i30: [
      { t: "event", text: "Submitted by Off By One", at: 14.5 },
      { t: "event", text: "Claimed by Marcus Lee", at: 12.9 },
      { t: "public", who: "Marcus Lee", text: "We can see the submission in the queue. Checking the judge host now.", at: 11.2 },
      { t: "internal", who: "Marcus Lee", text: "Judge host 3 has a stuck worker. Needs a specialist to restart it safely.", at: 9.0 },
      { t: "event", text: "Marcus Lee requested a specialist handoff", at: 8.8 },
    ],
    i29: [
      { t: "event", text: "Submitted by Team Aurora", at: 9.1 },
      { t: "event", text: "Claimed by Priya Raman", at: 7.4 },
      { t: "public", who: "Priya Raman", text: "On my way to Table 4.", at: 7.2 },
      { t: "internal", who: "Priya Raman", text: "Cable looks loose at the switch. Swapping the port first.", at: 3.1 },
      { t: "public", who: "Team Aurora", text: "Thanks! It came back for a second, then dropped again.", at: 2.4 },
    ],
    i28: [{ t: "event", text: "Submitted by Café Lambda", at: 23.8 }, { t: "event", text: "Claimed by Sofia Ortega", at: 21.0 }, { t: "public", who: "Sofia Ortega", text: "Checking the print queue now.", at: 20.1 }],
    i27: [{ t: "event", text: "Submitted by Dev Patel for Byte Bandits", at: 5.6 }],
    i26: [
      { t: "event", text: "Submitted by Segfault Society", at: 48 },
      { t: "event", text: "Claimed by Priya Raman", at: 46.5 },
      { t: "internal", who: "Priya Raman", text: "Spare workstation W-17 is ready. Moving the team's session over.", at: 40 },
      { t: "resolve", who: "Priya Raman", text: "Device issue resolved", at: 31 },
      { t: "award", who: "Hana Kim", text: "10 minutes awarded", at: 25 },
    ],
    i25: [{ t: "event", text: "Submitted by Greedy Goblins", at: 72 }, { t: "resolve", who: "Marcus Lee", text: "Service restored", at: 52 }, { t: "award", who: "Hana Kim", text: "5 minutes awarded", at: 44 }, { t: "event", text: "Dev Patel confirmed the award was applied externally", at: 40 }],
    i24: [{ t: "event", text: "Submitted by Heap Heroes", at: 95 }, { t: "resolve", who: "Sofia Ortega", text: "Resolved without comment", at: 88 }],
    i23: [
      { t: "event", text: "Submitted by Recursive Rabbits", at: 31 },
      { t: "resolve", who: "Marcus Lee", text: "Problem statement clarified", at: 22 },
      { t: "reopen", who: "Recursive Rabbits", text: "Reopened: the verdict is still wrong after the rejudge.", at: 12 },
      { t: "internal", who: "Marcus Lee", text: "Rejudge job failed silently. Asking the judge team.", at: 6 },
    ],
  },
  images: {
    i29: [{ name: "switch-port.jpg", who: "Priya Raman", vis: "internal", hue: 200 }, { name: "error-page.png", who: "Priya Raman", vis: "public", hue: 340 }],
    i26: [{ name: "monitor.webp", who: "Priya Raman", vis: "public", hue: 30 }],
  },
  members: [
    { name: "Priya Raman", username: "priya", roles: ["volunteer", "specialist"], admin: true },
    { name: "Marcus Lee", username: "marcus", roles: ["volunteer"], admin: false },
    { name: "Sofia Ortega", username: "sofia", roles: ["volunteer"], admin: false },
    { name: "Dev Patel", username: "dev", roles: ["specialist"], admin: false },
    { name: "Hana Kim", username: "hana", roles: ["jury"], admin: false },
    { name: "Team Aurora", username: "team-aurora", team: "Team Aurora" },
    { name: "Byte Bandits", username: "byte-bandits", team: "Byte Bandits" },
    { name: "Null Pointers", username: "null-pointers", team: "Null Pointers" },
  ],
};
const STATUS = {
  open: { label: "Open", icon: "circle-dashed" },
  claimed: { label: "In progress", icon: "circle-dot" },
  escalated: { label: "Awaiting specialist", icon: "arrow-up-right" },
  resolved: { label: "Resolved", icon: "circle-check" },
};
const teamOf = (issue) => DATA.teams.find((t) => t.id === issue.team);
// Unresolved time: from creation to now, or to resolution.
const elapsedMs = (issue) => ((issue.status === "resolved" ? issue.created - issue.resolved : issue.created) * 60000) + (issue.status === "resolved" ? 0 : Date.now() - NOW0);
const clock = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600); const m = Math.floor((s % 3600) / 60); const r = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : String(m)) + ":" + String(r).padStart(2, "0"); };
const relTime = (m) => m < 1 ? "just now" : m < 60 ? Math.round(m) + "m ago" : Math.floor(m / 60) + "h " + Math.round(m % 60) + "m ago";
const wallTime = (m) => new Date(NOW0 - m * 60000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
const initials = (n) => n.split(/\s+/).slice(0, 2).map((p) => p[0]).join("").toUpperCase();
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// Aging tier for live timers: fresh < 10 min, warning < 20 min, critical after.
const age = (issue) => issue.status === "resolved" ? "done" : elapsedMs(issue) < 600000 ? "fresh" : elapsedMs(issue) < 1200000 ? "warn" : "crit";
// Small fuzzy match: every query token must prefix-match a word in name or location.
const fuzzy = (q, s) => { const words = s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").split(/[^a-z0-9]+/); return q.toLowerCase().split(/\s+/).filter(Boolean).every((tok) => words.some((w) => w.startsWith(tok))); };

let view = "board", q = "";
const $ = (s) => document.querySelector(s);
const LANES = [
  ["open", "Waiting", "sky", "Nobody owns these yet"],
  ["claimed", "In progress", "violet", "A helper is on it"],
  ["escalated", "Specialist handoff", "amber", "Owner keeps it until accepted"],
  ["resolved", "Resolved", "emerald", "Timers stopped"],
];
const tone = { sky: ["text-sky-300", "bg-sky-400"], violet: ["text-violet-300", "bg-violet-400"], amber: ["text-amber-300", "bg-amber-400"], emerald: ["text-emerald-300", "bg-emerald-400"] };
const ageColor = { fresh: "bg-sky-400", warn: "bg-amber-400", crit: "bg-rose-500", done: "bg-emerald-500/50" };
const visible = () => DATA.issues.filter((i) => !q || fuzzy(q, teamOf(i).name + " " + teamOf(i).location));

function kpis() {
  const live = DATA.issues.filter((i) => i.status !== "resolved");
  const oldest = live.reduce((a, b) => (elapsedMs(a) > elapsedMs(b) ? a : b));
  const firsts = DATA.issues.filter((i) => i.first).map((i) => i.created - i.first).sort((a, b) => a - b);
  const med = firsts[Math.floor(firsts.length / 2)];
  const tiles = [
    ["Unresolved", live.length, "across 6 teams", "activity"],
    ["Waiting for a helper", DATA.issues.filter((i) => i.status === "open").length, "claim from the board", "hand"],
    ["Oldest unresolved", `<span data-timer="${oldest.id}">${clock(elapsedMs(oldest))}</span>`, `ISS-${oldest.number} · ${teamOf(oldest).name}`, "hourglass", "text-rose-300"],
    ["Median first assignment", clock(med * 60000), "submission → claim", "timer"],
    ["Awards to apply", DATA.issues.filter((i) => i.award && !i.award.applied).length, "in the contest system", "scale", "text-amber-300"],
  ];
  $("#kpis").innerHTML = tiles.map(([l, v, s, ic, c]) => `<div class="glass rounded-2xl p-4"><div class="flex items-center gap-2 text-xs uppercase tracking-wider text-slate-400"><i data-lucide="${ic}" style="width:14px"></i>${l}</div><div class="font-mono text-3xl font-semibold mt-2 ${c ?? "text-white"} tv-big">${v}</div><div class="text-xs text-slate-500 mt-1">${s}</div></div>`).join("");
}

function card(i) {
  const t = teamOf(i), a = age(i);
  const pct = Math.min(100, (elapsedMs(i) / 1800000) * 100);
  return `<button data-issue="${i.id}" class="card ${a} w-full text-left rounded-xl p-3.5 block">
    <div class="flex items-center gap-2 text-xs"><span class="font-mono text-slate-500">#${i.number}</span><span class="text-slate-400">${i.category}</span>${i.reopened ? `<span class="text-amber-300 flex items-center gap-1"><i data-lucide="rotate-ccw" style="width:12px"></i>Reopened</span>` : ""}<span class="ml-auto font-mono font-semibold ${a === "crit" ? "text-rose-300" : a === "warn" ? "text-amber-300" : "text-slate-300"}" data-timer="${i.id}">${clock(elapsedMs(i))}</span></div>
    <div class="mt-2 text-[15px] leading-snug text-white line-clamp-2">${esc(i.description)}</div>
    <div class="flex items-center gap-2 mt-3 text-xs"><span class="flex items-center gap-1 rounded-md bg-slate-800 px-1.5 py-0.5 text-slate-300"><i data-lucide="map-pin" style="width:12px"></i>${t.location.replace("Hall ", "").replace(" · Table ", "-")}</span><span class="text-slate-400 truncate">${t.name}</span>
    <span class="ml-auto">${i.owner ? `<span class="size-6 rounded-full bg-slate-700 grid place-items-center text-[10px] font-semibold text-white" title="${i.owner}">${initials(i.owner)}</span>` : `<span class="text-sky-300 font-medium">Claim →</span>`}</span></div>
    <div class="bar mt-3"><i class="${ageColor[a]}" style="width:${i.status === "resolved" ? 100 : pct}%"></i></div>
  </button>`;
}

function board() {
  const list = visible();
  return `<div class="grid md:grid-cols-2 xl:grid-cols-4 gap-4">${LANES.map(([s, l, c, sub]) => { const items = list.filter((i) => i.status === s); return `<div class="lane rounded-2xl p-3 min-h-[420px]"><div class="flex items-center gap-2 px-1 pb-3"><span class="size-2 rounded-full ${tone[c][1]}"></span><span class="font-semibold text-white">${l}</span><span class="font-mono text-xs text-slate-500">${items.length}</span><span class="ml-auto text-[11px] text-slate-500 tv-hide">${sub}</span></div><div class="space-y-2.5">${items.map(card).join("") || `<div class="rounded-xl border border-dashed border-slate-700 text-slate-500 text-sm py-8 text-center">Empty</div>`}</div></div>`; }).join("")}</div>
  <p class="text-xs text-slate-500 mt-4 tv-hide">The bar under each card fills over 30 minutes. Blue: under 10 min · amber: under 20 min · rose: 20 min or more. Drag a card to the next lane to claim, escalate or resolve.</p>`;
}

function floor() {
  const halls = { A: DATA.teams.filter((t) => t.location.startsWith("Hall A")), B: DATA.teams.filter((t) => t.location.startsWith("Hall B")) };
  const pinColor = { open: "bg-sky-400 text-slate-950", claimed: "bg-violet-400 text-slate-950", escalated: "bg-amber-400 text-slate-950" };
  const hall = (name, teams) => `<div class="glass rounded-2xl p-5"><div class="flex items-center justify-between"><h3 class="font-semibold text-white">Hall ${name}</h3><span class="text-xs text-slate-500">${teams.length} teams</span></div>
    <div class="relative mt-4 rounded-xl bg-slate-950/50 border border-slate-800 aspect-[16/9]" style="background-image: radial-gradient(rgb(148 163 184 / .12) 1px, transparent 1px); background-size: 22px 22px">
    <div class="absolute left-3 top-3 text-[10px] uppercase tracking-widest text-slate-600">Stage</div>
    ${teams.map((t) => { const live = DATA.issues.filter((i) => i.team === t.id && i.status !== "resolved"); const worst = live.sort((a, b) => elapsedMs(b) - elapsedMs(a))[0]; const x = ((t.x - (name === "B" ? 5 : 0)) / 5.5) * 100, y = (t.y / 6) * 100; return `<button ${worst ? `data-issue="${worst.id}"` : ""} class="pin absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center gap-1" style="left:${x}%;top:${y}%"><span class="size-9 rounded-lg grid place-items-center text-xs font-bold ${worst ? pinColor[worst.status] + (age(worst) === "crit" ? " ring-pulse" : "") : "bg-slate-800 text-slate-400 border border-slate-700"}">${t.location.split("Table ")[1]}</span><span class="text-[10px] text-slate-400 whitespace-nowrap">${t.name}</span>${worst ? `<span class="font-mono text-[10px] ${age(worst) === "crit" ? "text-rose-300" : "text-slate-300"}" data-timer="${worst.id}">${clock(elapsedMs(worst))}</span>` : ""}</button>`; }).join("")}
    </div></div>`;
  return `<div class="grid lg:grid-cols-2 gap-4">${hall("A", halls.A)}${hall("B", halls.B)}</div>
  <div class="flex gap-4 text-xs text-slate-400 mt-4">${[["bg-sky-400", "Waiting"], ["bg-violet-400", "In progress"], ["bg-amber-400", "Specialist handoff"], ["bg-slate-700", "No open issue"]].map(([c, l]) => `<span class="flex items-center gap-1.5"><span class="size-3 rounded ${c}"></span>${l}</span>`).join("")}<span class="flex items-center gap-1.5"><span class="size-3 rounded bg-rose-500 ring-pulse"></span>Pulsing: unresolved for 20 min or more</span></div>`;
}

function awards() {
  const res = DATA.issues.filter((i) => i.status === "resolved");
  const col = (title, sub, items, body) => `<div class="lane rounded-2xl p-3"><div class="px-1 pb-3"><div class="font-semibold text-white">${title} <span class="font-mono text-xs text-slate-500">${items.length}</span></div><div class="text-[11px] text-slate-500">${sub}</div></div><div class="space-y-2.5">${items.map(body).join("")}</div></div>`;
  const base = (i) => `<div class="flex items-center gap-2 text-xs"><span class="font-mono text-slate-500">#${i.number}</span><span class="text-slate-400">${teamOf(i).name}</span><span class="ml-auto font-mono text-slate-400">${clock(elapsedMs(i))} lost</span></div><div class="mt-1.5 text-sm text-white">${esc(i.description)}</div>`;
  return `<div class="grid md:grid-cols-3 gap-4">
    ${col("Needs a decision", "Jury records minutes and a public explanation", res.filter((i) => !i.award), (i) => `<div class="card rounded-xl p-3.5">${base(i)}<div class="flex gap-1.5 mt-3">${[0, 5, 10, 15].map((m) => `<button class="rounded-md bg-slate-800 hover:bg-slate-700 px-2.5 h-7 text-xs font-mono">+${m}</button>`).join("")}<button class="rounded-md bg-slate-800 px-2.5 h-7 text-xs">Custom</button></div></div>`)}
    ${col("Decided · not applied", "Apply in the contest system, then confirm here", res.filter((i) => i.award && !i.award.applied), (i) => `<div class="card warn rounded-xl p-3.5">${base(i)}<div class="mt-3 flex items-center gap-3"><span class="font-mono text-2xl font-semibold text-amber-300">+${i.award.minutes}m</span><span class="text-xs text-slate-400">by ${i.award.by}<br>“${esc(i.award.explanation)}”</span></div><button class="mt-3 w-full rounded-lg bg-amber-400 text-slate-950 h-8 text-sm font-semibold">Confirm applied externally</button></div>`)}
    ${col("Applied", "Minsky records confirmation only", res.filter((i) => i.award?.applied), (i) => `<div class="card rounded-xl p-3.5">${base(i)}<div class="mt-3 flex items-center gap-3"><span class="font-mono text-2xl font-semibold text-emerald-300">+${i.award.minutes}m</span><span class="text-xs text-slate-400">Applied by ${i.award.applied.by} · ${wallTime(i.award.applied.at)}</span></div></div>`)}
  </div>`;
}

function openFocus(id) {
  const i = DATA.issues.find((x) => x.id === id), t = teamOf(i);
  const hist = DATA.history[i.id] ?? [];
  $("#focus-body").innerHTML = `<div class="flex items-center gap-3 px-6 h-14 border-b border-slate-800"><span class="font-mono text-slate-500">#${i.number}</span><span class="text-sm text-slate-300">${t.name} · ${t.location}</span><div class="flex-1"></div><button data-close class="size-8 grid place-items-center rounded-lg hover:bg-slate-800"><i data-lucide="x"></i></button></div>
  <div class="flex-1 grid grid-cols-[1fr_300px] min-h-0">
    <div class="flex flex-col min-h-0"><div class="p-6 pb-3"><h2 class="text-2xl font-semibold text-white leading-tight">${esc(i.description)}</h2></div>
      <div class="flex-1 overflow-y-auto px-6 space-y-3">${hist.map((h) => h.t === "public" || h.t === "internal" ? `<div class="flex gap-3 ${h.who === t.name ? "" : ""}"><span class="size-8 rounded-full bg-slate-700 grid place-items-center text-xs font-semibold text-white shrink-0">${initials(h.who)}</span><div class="rounded-xl px-4 py-3 max-w-[85%] ${h.t === "internal" ? "bg-amber-400/10 border border-amber-400/30" : "bg-slate-800"}"><div class="text-xs text-slate-400 flex gap-2">${h.who} · ${wallTime(h.at)}${h.t === "internal" ? `<span class="text-amber-300 flex items-center gap-1"><i data-lucide="eye-off" style="width:12px"></i>Staff only</span>` : ""}</div><div class="text-sm mt-1">${esc(h.text)}</div></div></div>` : `<div class="text-xs text-slate-500 flex items-center gap-2 pl-11"><span class="h-px w-4 bg-slate-700"></span>${esc(h.text)} · ${wallTime(h.at)}</div>`).join("")}</div>
      <div class="p-4 border-t border-slate-800 flex gap-2"><div class="flex rounded-lg bg-slate-800 p-1 text-xs"><button class="px-2.5 rounded-md bg-slate-700 text-white">To team</button><button class="px-2.5 rounded-md text-amber-300">Staff only</button></div><input class="flex-1 bg-slate-800 rounded-lg px-3 text-sm outline-none" placeholder="Write a reply…"><button class="rounded-lg bg-sky-400 text-slate-950 px-4 text-sm font-semibold">Send</button></div></div>
    <aside class="border-l border-slate-800 p-5 space-y-5 overflow-y-auto">
      <div><div class="text-xs uppercase tracking-wider text-slate-500">Unresolved time</div><div class="font-mono text-4xl font-semibold mt-1 ${age(i) === "crit" ? "text-rose-300" : "text-white"}" data-timer="${i.id}">${clock(elapsedMs(i))}</div><div class="bar mt-2"><i class="${ageColor[age(i)]}" style="width:${Math.min(100, elapsedMs(i) / 18000)}%"></i></div></div>
      <div class="grid grid-cols-2 gap-3 text-sm"><div><div class="text-xs text-slate-500">First assignment</div><div class="font-mono">${i.first ? clock((i.created - i.first) * 60000) : "—"}</div></div><div><div class="text-xs text-slate-500">Owner</div><div>${i.owner ?? "Nobody yet"}</div></div></div>
      ${i.status === "escalated" ? `<div class="rounded-xl border border-amber-400/30 bg-amber-400/10 p-3 text-sm"><div class="font-semibold text-amber-200">Handoff pending</div><div class="text-slate-300 mt-1">${i.owner} is still responsible.</div><button class="mt-3 w-full rounded-lg bg-amber-400 text-slate-950 h-9 font-semibold">Accept as specialist</button></div>` : ""}
      <div class="space-y-2">${{ open: `<button class="w-full rounded-lg bg-sky-400 text-slate-950 h-10 font-semibold">Claim</button>`, claimed: `<button class="w-full rounded-lg bg-emerald-400 text-slate-950 h-10 font-semibold">Resolve</button><button class="w-full rounded-lg bg-slate-800 h-10">Escalate to specialist</button>`, escalated: "", resolved: `<button class="w-full rounded-lg bg-slate-800 h-10">Reopen</button>` }[i.status]}</div>
      <div><div class="text-xs uppercase tracking-wider text-slate-500 mb-2">Images</div><div class="grid grid-cols-3 gap-2">${(DATA.images[i.id] ?? []).map((m) => `<div class="aspect-square rounded-lg relative" style="background:linear-gradient(135deg,hsl(${m.hue} 60% 45%),hsl(${m.hue + 40} 60% 25%))">${m.vis === "internal" ? `<i data-lucide="eye-off" class="absolute right-1 top-1 text-white" style="width:12px"></i>` : ""}</div>`).join("")}<button class="aspect-square rounded-lg border border-dashed border-slate-700 grid place-items-center text-slate-500"><i data-lucide="plus"></i></button></div></div>
    </aside></div>`;
  $("#focus").classList.remove("hidden");
  lucide.createIcons();
}

function render() {
  kpis();
  $("#view").innerHTML = { board, floor, awards }[view]();
  document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.view === view));
  lucide.createIcons();
}
document.addEventListener("click", (e) => {
  const v = e.target.closest("[data-view]"); if (v) { view = v.dataset.view; render(); return; }
  if (e.target.closest("#focus [data-close]")) { $("#focus").classList.add("hidden"); return; }
  const c = e.target.closest("[data-issue]"); if (c) { openFocus(c.dataset.issue); return; }
  if (e.target.closest("#tv")) document.body.classList.toggle("tv");
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("#focus").classList.add("hidden"); });
$("#q").addEventListener("input", (e) => { q = e.target.value; render(); });
setInterval(() => { $("#clock").textContent = new Date().toLocaleTimeString([], { hour12: false }); document.querySelectorAll("[data-timer]").forEach((n) => { n.textContent = clock(elapsedMs(DATA.issues.find((x) => x.id === n.dataset.timer))); }); }, 1000);
render();
</script>
</body>
</html>
