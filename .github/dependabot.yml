version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # typescript-eslint 8.71 accepts TypeScript >=4.8.4 <6.1.0 only.
      # TypeScript 7 makes npm ci fail with ERESOLVE. Patch and minor updates remain.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
