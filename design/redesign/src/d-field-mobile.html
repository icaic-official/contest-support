<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Minsky · D · Field mobile</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet" />
<script>tailwind.config = { theme: { extend: { fontFamily: { sans: ["Plus Jakarta Sans", "sans-serif"], mono: ["JetBrains Mono", "monospace"] } } } };</script>
<style>
  [data-lucide] { width: 18px; height: 18px; stroke-width: 2.2; }
  .phone { width: 360px; height: 740px; border-radius: 44px; padding: 10px; background: #0b0b0f; box-shadow: 0 30px 80px -20px rgb(0 0 0 / .45), inset 0 0 0 2px #2a2a33; }
  .screen { border-radius: 34px; overflow: hidden; height: 100%; position: relative; background: #f4f4f6; }
  .scroll { height: calc(100% - 84px); overflow-y: auto; scrollbar-width: none; }
  .chip[aria-pressed="true"] { background: #111; color: white; }
  .sheet { transition: transform .3s cubic-bezier(.32,.72,0,1); }
  .swipe { background: linear-gradient(90deg, #10b981, #34d399); }
</style>
</head>
<body class="bg-gradient-to-br from-violet-100 via-white to-emerald-100 min-h-screen font-sans text-zinc-900">
<div class="max-w-[1240px] mx-auto px-4 py-10">
  <h1 class="text-3xl font-extrabold tracking-tight">Field mode</h1>
  <p class="text-zinc-600 mt-1 max-w-2xl">A phone-first app for helpers who walk the hall. It uses large touch targets and one main action per screen. The table number comes first, and the action bar stays within reach of the thumb. Tap the cards to try it.</p>
  <div class="flex flex-wrap gap-6 mt-10 justify-center">
    <figure><div class="phone"><div class="screen" id="p1"></div></div><figcaption class="text-center text-sm text-zinc-500 mt-3">Helper · nearby queue</figcaption></figure>
    <figure><div class="phone"><div class="screen" id="p2"></div></div><figcaption class="text-center text-sm text-zinc-500 mt-3">Helper · issue and actions</figcaption></figure>
    <figure><div class="phone"><div class="screen" id="p3"></div></div><figcaption class="text-center text-sm text-zinc-500 mt-3">Jury · award in three taps</figcaption></figure>
  </div>
</div>
<script>
/*DATA*/
let filter = "near", current = "i29", sheet = false, composer = "public", award = 10;
const statusStyle = { open: "bg-blue-100 text-blue-800", claimed: "bg-violet-100 text-violet-800", escalated: "bg-amber-100 text-amber-900", resolved: "bg-emerald-100 text-emerald-800" };
const status = (s) => `<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full ${statusStyle[s]}">${STATUS[s].label}</span>`;
const statusBar = `<div class="h-11 px-7 flex items-center justify-between text-[13px] font-semibold"><span>10:46</span><span class="flex gap-1 items-center"><i data-lucide="signal" style="width:14px"></i><i data-lucide="wifi" style="width:14px"></i><i data-lucide="battery-full" style="width:16px"></i></span></div>`;
const tabs = (active) => `<nav class="absolute bottom-0 inset-x-0 h-[84px] bg-white/90 backdrop-blur border-t border-zinc-200 grid grid-cols-4 pt-2 text-[11px] font-medium">${[["inbox", "Queue"], ["user-round-check", "Mine"], ["search", "Find team"], ["circle-user-round", "Me"]].map(([i, l], n) => `<div class="flex flex-col items-center gap-1 ${n === active ? "text-zinc-900" : "text-zinc-400"}"><i data-lucide="${i}"></i>${l}</div>`).join("")}</nav>`;

function p1() {
  const lists = { near: DATA.issues.filter((i) => i.status !== "resolved" && teamOf(i).location.startsWith("Hall A")), open: DATA.issues.filter((i) => i.status === "open"), all: DATA.issues.filter((i) => i.status !== "resolved") };
  const list = lists[filter];
  return `${statusBar}<div class="scroll px-4">
    <div class="flex items-center justify-between mt-1"><div><div class="text-xs text-zinc-500 font-medium">Finals · Contest day</div><div class="text-2xl font-extrabold tracking-tight">Queue</div></div><span class="size-10 rounded-full bg-zinc-900 text-white grid place-items-center text-sm font-bold">PR</span></div>
    <div class="mt-4 rounded-3xl bg-zinc-900 text-white p-4 flex items-center gap-4"><div class="flex-1"><div class="text-xs text-zinc-400">You're in</div><div class="font-bold text-lg">Hall A</div><div class="text-xs text-zinc-400">2 waiting · oldest <span class="font-mono text-amber-300">5:36</span></div></div><button class="rounded-2xl bg-white text-zinc-900 px-4 h-11 font-bold text-sm">Next issue</button></div>
    <div class="flex gap-2 mt-4">${[["near", "Near me"], ["open", "Unclaimed"], ["all", "All active"]].map(([k, l]) => `<button data-filter="${k}" aria-pressed="${filter === k}" class="chip rounded-full px-3.5 h-8 text-sm font-semibold bg-white border border-zinc-200">${l}</button>`).join("")}</div>
    <div class="space-y-3 mt-4 pb-6">${list.map((i) => { const t = teamOf(i); const a = age(i); return `<button data-open="${i.id}" class="w-full text-left rounded-3xl bg-white p-4 shadow-sm border ${a === "crit" ? "border-rose-300" : "border-transparent"}">
      <div class="flex items-start gap-3"><div class="rounded-2xl ${a === "crit" ? "bg-rose-500 text-white" : "bg-zinc-100"} w-14 h-14 grid place-items-center shrink-0"><div class="text-center leading-none"><div class="text-[10px] font-semibold opacity-70">${t.location.slice(5, 6)}</div><div class="text-xl font-extrabold">${t.location.split("Table ")[1]}</div></div></div>
      <div class="min-w-0 flex-1"><div class="flex items-center gap-2">${status(i.status)}<span class="ml-auto font-mono text-sm ${a === "crit" ? "text-rose-600" : a === "warn" ? "text-amber-600" : "text-zinc-500"}" data-timer="${i.id}">${clock(elapsedMs(i))}</span></div><div class="font-bold mt-1.5">${t.name}</div><div class="text-sm text-zinc-600 line-clamp-2">${esc(i.description)}</div></div></div>
      ${i.status === "open" ? `<div class="mt-3 swipe rounded-2xl h-11 flex items-center px-1.5 text-white font-bold text-sm"><span class="size-8 rounded-xl bg-white text-emerald-600 grid place-items-center"><i data-lucide="chevrons-right"></i></span><span class="flex-1 text-center -ml-8">Slide to claim</span></div>` : ""}</button>`; }).join("")}</div></div>${tabs(0)}`;
}

function p2() {
  const i = DATA.issues.find((x) => x.id === current), t = teamOf(i);
  const hist = DATA.history[i.id] ?? [];
  return `${statusBar}<div class="scroll px-4 pb-28">
    <div class="flex items-center gap-2 mt-1"><button class="size-9 rounded-full bg-white grid place-items-center"><i data-lucide="chevron-left"></i></button><span class="font-mono text-sm text-zinc-500">ISS-${i.number}</span><span class="ml-auto">${status(i.status)}</span></div>
    <div class="mt-4 rounded-3xl bg-white p-5"><div class="flex items-center gap-2 text-sm text-zinc-500"><i data-lucide="map-pin" style="width:15px"></i><span class="font-bold text-zinc-900">${t.location}</span></div><div class="text-xl font-extrabold mt-1 leading-tight">${t.name}</div><p class="mt-2 text-zinc-700">${esc(i.description)}</p>
      <div class="grid grid-cols-2 gap-2 mt-4"><div class="rounded-2xl bg-zinc-100 p-3"><div class="text-[11px] text-zinc-500 font-medium">Unresolved</div><div class="font-mono text-2xl ${age(i) === "crit" ? "text-rose-600" : ""}" data-timer="${i.id}">${clock(elapsedMs(i))}</div></div><div class="rounded-2xl bg-zinc-100 p-3"><div class="text-[11px] text-zinc-500 font-medium">First assignment</div><div class="font-mono text-2xl">${i.first ? clock((i.created - i.first) * 60000) : "—"}</div></div></div></div>
    ${i.status === "escalated" ? `<div class="mt-3 rounded-3xl bg-amber-100 p-4 text-sm"><b>Specialist requested.</b> ${i.owner} stays the owner until a specialist accepts.</div>` : ""}
    <div class="mt-5 text-xs font-bold uppercase tracking-wider text-zinc-400 px-1">Activity</div>
    <div class="mt-2 space-y-2">${hist.map((h) => h.t === "public" || h.t === "internal" ? `<div class="rounded-2xl p-3 ${h.t === "internal" ? "bg-amber-50 border border-amber-200" : "bg-white"}"><div class="text-[11px] text-zinc-500 flex items-center gap-1">${h.t === "internal" ? `<i data-lucide="lock" style="width:11px"></i><b class="text-amber-800">Staff only</b> · ` : ""}${h.who} · ${wallTime(h.at)}</div><div class="text-sm mt-0.5">${esc(h.text)}</div></div>` : `<div class="text-xs text-zinc-500 px-3">• ${esc(h.text)} · ${wallTime(h.at)}</div>`).join("")}</div>
    ${(DATA.images[i.id] ?? []).length ? `<div class="flex gap-2 mt-3">${DATA.images[i.id].map((m) => `<div class="size-16 rounded-2xl" style="background:linear-gradient(135deg,hsl(${m.hue} 60% 60%),hsl(${m.hue + 40} 60% 40%))"></div>`).join("")}</div>` : ""}
  </div>
  <div class="absolute bottom-0 inset-x-0 p-4 pb-7 bg-gradient-to-t from-zinc-100 via-zinc-100 to-transparent"><div class="flex gap-2"><button data-sheet class="size-14 rounded-2xl bg-white grid place-items-center shadow"><i data-lucide="message-square-plus"></i></button><button class="size-14 rounded-2xl bg-white grid place-items-center shadow"><i data-lucide="camera"></i></button>
    ${{ open: `<button class="flex-1 rounded-2xl bg-zinc-900 text-white font-bold">Claim</button>`, claimed: `<button class="flex-1 rounded-2xl bg-emerald-500 text-white font-bold flex items-center justify-center gap-2"><i data-lucide="check"></i>Resolve</button>`, escalated: `<button class="flex-1 rounded-2xl bg-amber-400 font-bold">Accept handoff</button>`, resolved: `<button class="flex-1 rounded-2xl bg-white font-bold">Reopen</button>` }[i.status]}</div></div>
  <div class="absolute inset-0 bg-black/40 ${sheet ? "" : "hidden"}" data-sheet></div>
  <div class="sheet absolute inset-x-0 bottom-0 rounded-t-[28px] bg-white p-5 pb-8 ${sheet ? "" : "translate-y-full"}"><div class="mx-auto w-10 h-1.5 rounded-full bg-zinc-200"></div>
    <div class="grid grid-cols-2 gap-2 mt-4 rounded-2xl bg-zinc-100 p-1 text-sm font-bold"><button data-composer="public" class="h-10 rounded-xl ${composer === "public" ? "bg-white shadow" : "text-zinc-500"}">To the team</button><button data-composer="internal" class="h-10 rounded-xl ${composer === "internal" ? "bg-amber-400 shadow" : "text-zinc-500"}">Staff only</button></div>
    <div class="flex flex-wrap gap-2 mt-3">${["On my way", "Swapping the cable", "Please restart the IDE"].map((s) => `<span class="rounded-full border border-zinc-200 px-3 h-8 text-sm grid place-items-center">${s}</span>`).join("")}</div>
    <textarea class="mt-3 w-full rounded-2xl ${composer === "internal" ? "bg-amber-50 border-amber-200" : "bg-zinc-100 border-transparent"} border p-3 outline-none" rows="3" placeholder="${composer === "internal" ? "Only staff will see this" : "The team will see this"}"></textarea>
    <button class="mt-3 w-full h-12 rounded-2xl bg-zinc-900 text-white font-bold">Send</button></div>`;
}

function p3() {
  const i = DATA.issues.find((x) => x.id === "i24"), t = teamOf(i);
  return `${statusBar}<div class="scroll px-4">
    <div class="text-xs text-zinc-500 font-medium mt-1">Jury</div><div class="text-2xl font-extrabold tracking-tight">Award review</div>
    <div class="flex gap-2 mt-4 text-sm font-semibold"><span class="rounded-full bg-zinc-900 text-white px-3.5 h-8 grid place-items-center">To decide · 1</span><span class="rounded-full bg-white border px-3.5 h-8 grid place-items-center">To apply · 1</span></div>
    <div class="mt-4 rounded-3xl bg-white p-5"><div class="flex items-center gap-2">${status("resolved")}<span class="font-mono text-xs text-zinc-500">ISS-${i.number}</span></div><div class="font-bold text-lg mt-2">${t.name} <span class="text-zinc-400 font-medium text-sm">${t.location}</span></div><p class="text-sm text-zinc-600 mt-1">${esc(i.description)}</p>
      <div class="grid grid-cols-3 gap-2 mt-4 text-center"><div class="rounded-2xl bg-zinc-100 py-2"><div class="font-mono font-bold">${clock(elapsedMs(i))}</div><div class="text-[10px] text-zinc-500">unresolved</div></div><div class="rounded-2xl bg-zinc-100 py-2"><div class="font-mono font-bold">${clock((i.created - i.first) * 60000)}</div><div class="text-[10px] text-zinc-500">to assign</div></div><div class="rounded-2xl bg-zinc-100 py-2"><div class="font-bold text-sm mt-0.5">${initials(i.owner)}</div><div class="text-[10px] text-zinc-500">resolved</div></div></div></div>
    <div class="mt-4 rounded-3xl bg-white p-5"><div class="text-sm font-bold">Minutes to award</div>
      <div class="text-center mt-3"><span class="text-6xl font-extrabold tracking-tight" id="award-n">${award}</span><span class="text-zinc-400 font-bold"> min</span></div>
      <div class="grid grid-cols-5 gap-1.5 mt-4">${[0, 5, 10, 15, 30].map((m) => `<button data-award="${m}" class="h-10 rounded-xl font-bold text-sm ${award === m ? "bg-violet-600 text-white" : "bg-zinc-100"}">${m}</button>`).join("")}</div>
      <textarea class="mt-3 w-full rounded-2xl bg-zinc-100 p-3 text-sm outline-none" rows="2" placeholder="Public explanation for the team"></textarea>
      <button class="mt-3 w-full h-12 rounded-2xl bg-violet-600 text-white font-bold">Record ${award} minutes</button>
      <p class="text-[11px] text-zinc-500 mt-2 text-center">Staff confirm separately when the award is applied in the contest system.</p></div>
    <div class="h-6"></div></div>${tabs(0)}`;
}

function render() {
  document.getElementById("p1").innerHTML = p1();
  document.getElementById("p2").innerHTML = p2();
  document.getElementById("p3").innerHTML = p3();
  lucide.createIcons();
}
document.addEventListener("click", (e) => {
  const g = (s) => e.target.closest(s);
  if (g("[data-filter]")) filter = g("[data-filter]").dataset.filter;
  else if (g("[data-open]")) { current = g("[data-open]").dataset.open; sheet = false; }
  else if (g("[data-composer]")) composer = g("[data-composer]").dataset.composer;
  else if (g("[data-sheet]")) sheet = !sheet;
  else if (g("[data-award]")) award = Number(g("[data-award]").dataset.award);
  else return;
  render();
});
setInterval(() => document.querySelectorAll("[data-timer]").forEach((n) => { n.textContent = clock(elapsedMs(DATA.issues.find((x) => x.id === n.dataset.timer))); }), 1000);
render();
</script>
</body>
</html>
