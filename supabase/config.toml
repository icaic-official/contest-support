project_id = "minsky"
[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 17
[db.seed]
enabled = false
[auth]
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/", "http://127.0.0.1:4173/"]
enable_signup = false
enable_anonymous_sign_ins = false
[auth.email]
# Keep the email/password provider enabled for internal username identifiers.
# auth.enable_signup above blocks public self-registration.
enable_signup = true
enable_confirmations = true
[functions.admin]
# Supabase publishable keys are not JWTs. The handler validates every caller.
verify_jwt = false
[functions.attachments]
verify_jwt = false
[functions.announcement-images]
verify_jwt = false
[functions.workflow]
# The handler verifies the bearer token with Auth before using the service client.
verify_jwt = false
