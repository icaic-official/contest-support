// Unresolved time: from creation to now, or to resolution.
const elapsedMs = (issue) => ((issue.status === "resolved" ? issue.created - issue.resolved : issue.created) * 60000) + (issue.status === "resolved" ? 0 : Date.now() - NOW0);
const clock = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600); const m = Math.floor((s % 3600) / 60); const r = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : String(m)) + ":" + String(r).padStart(2, "0"); };
const relTime = (m) => m < 1 ? "just now" : m < 60 ? Math.round(m) + "m ago" : Math.floor(m / 60) + "h " + Math.round(m % 60) + "m ago";
const wallTime = (m) => new Date(NOW0 - m * 60000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
const initials = (n) => n.split(/\s+/).slice(0, 2).map((p) => p[0]).join("").toUpperCase();
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// Aging tier for live timers: fresh < 10 min, warning < 20 min, critical after.
const age = (issue) => issue.status === "resolved" ? "done" : elapsedMs(issue) < 600000 ? "fresh" : elapsedMs(issue) < 1200000 ? "warn" : "crit";
// Small fuzzy match: every query token must prefix-match a word in name or location.
const fuzzy = (q, s) => { const words = s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").split(/[^a-z0-9]+/); return q.toLowerCase().split(/\s+/).filter(Boolean).every((tok) => words.some((w) => w.startsWith(tok))); };

function statCards() {

}

function issueRows(list) {
  if (!list.length) return `<div class="py-16 text-center text-sm text-muted-foreground"><i data-lucide="inbox" class="mx-auto mb-2" style="width:24px;height:24px"></i>No issues in this view.</div>`;
  return list.map((i) => { const t = teamOf(i); return `<tr class="row border-b border-border cursor-pointer ${selected === i.id ? "sel" : ""}" data-issue="${i.id}">
    <td class="px-4 py-3 font-mono text-xs text-muted-foreground whitespace-nowrap">ISS-${i.number}</td>
    <td class="py-3">${statusBadge(i.status)}${i.reopened ? ` <span class="badge text-muted-foreground"><i data-lucide="rotate-ccw" style="width:12px;height:12px"></i>Reopened</span>` : ""}</td>
    <td class="py-3 pr-4 max-w-[420px]"><div class="truncate font-medium">${esc(i.description)}</div><div class="text-xs text-muted-foreground">${i.category}</div></td>
    <td class="py-3 pr-4 whitespace-nowrap"><div class="font-medium">${t.name}</div><div class="text-xs text-muted-foreground">${t.location}</div></td>
    <td class="py-3 pr-4 whitespace-nowrap"><div class="flex items-center gap-2">${avatar(i.owner)}<span class="${i.owner ? "" : "text-muted-foreground"}">${i.owner ?? "Unassigned"}</span></div></td>
    <td class="py-3 pr-4 text-right font-mono tabular-nums age-${age(i)}" data-timer="${i.id}">${clock(elapsedMs(i))}</td></tr>`; }).join("");
}

function queuePage(scope) {
  let list = DATA.issues;
  if (scope === "mine") list = list.filter((i) => i.owner === "Priya Raman");
  if (scope === "handoffs") list = list.filter((i) => i.status === "escalated");
  if (persona === "contestant") list = list.filter((i) => i.team === "t1" || i.team === "t4");
  const tabs = [["active", "Active", (i) => i.status !== "resolved"], ["open", "Open", (i) => i.status === "open"], ["claimed", "In progress", (i) => i.status === "claimed"], ["escalated", "Awaiting specialist", (i) => i.status === "escalated"], ["resolved", "Resolved", (i) => i.status === "resolved"], ["all", "All", () => true]];
  const fn = tabs.find((t) => t[0] === tab)[2];
  const shown = list.filter(fn);
  return `<div class="p-6 space-y-6 max-w-[1400px]">
    <div class="flex items-end justify-between gap-4"><div><h1 class="text-2xl font-semibold tracking-tight">${scope === "mine" ? "Assigned to me" : scope === "handoffs" ? "Specialist handoffs" : "Issue queue"}</h1><p class="text-sm text-muted-foreground mt-1">Live view of every report in ${DATA.session.name}. Timers come from saved timestamps.</p></div>
    <button class="btn btn-primary" data-action="report"><i data-lucide="plus"></i>Report for a team</button></div>
    ${scope === "queue" ? statCards() : ""}
    <div class="flex items-center gap-3 flex-wrap">
      <div class="inline-flex rounded-lg bg-muted p-1 text-sm text-muted-foreground">${tabs.map(([k, l, f]) => `<button class="tabs-trigger rounded-md px-3 h-7 font-medium" data-tab="${k}" aria-selected="${tab === k}">${l} <span class="ml-1 text-xs opacity-70 tabular-nums">${list.filter(f).length}</span></button>`).join("")}</div>
      <button class="btn btn-outline btn-sm border-dashed"><i data-lucide="circle-plus"></i>Category</button>
      <button class="btn btn-outline btn-sm border-dashed" data-action="cmd"><i data-lucide="map-pin"></i>Team or table</button>
      <div class="flex-1"></div><button class="btn btn-outline btn-sm"><i data-lucide="settings-2"></i>View</button>
    </div>
    <div class="rounded-xl border border-border overflow-hidden"><table class="w-full text-sm"><thead class="text-muted-foreground text-xs"><tr class="border-b border-border"><th class="px-4 h-10 text-left font-medium w-24">Issue</th><th class="text-left font-medium w-44">Status</th><th class="text-left font-medium">Report</th><th class="text-left font-medium">Team</th><th class="text-left font-medium">Owner</th><th class="text-right font-medium pr-4">Unresolved</th></tr></thead><tbody>${issueRows(shown)}</tbody></table></div>
    <p class="text-xs text-muted-foreground">Timer colours: grey under 10 min · <span class="age-warn">amber</span> under 20 min · <span class="age-crit">rose</span> after 20 min. Press <span class="kbd">J</span>/<span class="kbd">K</span> to move, <span class="kbd">C</span> to claim.</p>
  </div>`;
}

function contestantHelp() {
  const mine = DATA.issues.filter((i) => i.team === "t1" || i.team === "t4").slice(0, 2);
  return `<div class="p-6 max-w-3xl mx-auto space-y-8">
    <div class="rounded-2xl border border-border bg-card p-8"><div class="flex items-center gap-2 text-sm text-muted-foreground"><i data-lucide="map-pin"></i>Team Aurora · Hall A · Table 4</div><h1 class="text-3xl font-semibold tracking-tight mt-3">Need help? A helper will come to your table.</h1><p class="text-muted-foreground mt-2">Your timer starts when you submit. You can follow every step here.</p>
      <div class="grid grid-cols-3 gap-2 mt-6">${DATA.session.categories.map((c, n) => `<button class="rounded-lg border border-border p-3 text-left hover:bg-accent ${n === 0 ? "ring-2 ring-ring" : ""}"><i data-lucide="${["monitor", "wifi", "gavel", "file-text", "printer", "circle-help"][n]}"></i><div class="text-sm font-medium mt-2">${c}</div></button>`).join("")}</div>
      <textarea class="mt-4 w-full min-h-24 rounded-lg border border-input bg-transparent p-3 text-sm outline-none focus:ring-2 focus:ring-ring" placeholder="What’s happening? For example: the keyboard stopped working after the IDE froze."></textarea>
      <div class="flex items-center justify-between mt-3"><span class="text-xs text-muted-foreground flex items-center gap-1.5"><span class="size-2 rounded-full bg-emerald-500"></span>Intake is open</span><button class="btn btn-primary"><i data-lucide="send"></i>Submit issue</button></div></div>
    <div><h2 class="text-sm font-medium text-muted-foreground mb-3">Your reports</h2><div class="space-y-3">${mine.map((i) => `<button data-issue="${i.id}" class="w-full text-left rounded-xl border border-border bg-card p-4 hover:bg-accent/50"><div class="flex items-center gap-2">${statusBadge(i.status)}<span class="font-mono text-xs text-muted-foreground">ISS-${i.number}</span><span class="ml-auto font-mono text-sm age-${age(i)}" data-timer="${i.id}">${clock(elapsedMs(i))}</span></div><div class="mt-2 font-medium">${esc(i.description)}</div>${tracker(i)}</button>`).join("")}</div></div></div>`;
}

function tracker(i) {
  const steps = [["Submitted", true], ["Helper assigned", !!i.owner], ["Resolved", i.status === "resolved"], ["Time award", !!i.award]];
  return `<ol class="flex items-center gap-2 mt-4 text-xs">${steps.map(([l, d], n) => `<li class="flex items-center gap-2 ${d ? "" : "text-muted-foreground"}"><span class="size-5 rounded-full grid place-items-center ${d ? "bg-primary text-primary-foreground" : "border border-border"}">${d ? `<i data-lucide="check" style="width:12px;height:12px"></i>` : n + 1}</span>${l}</li>${n < steps.length - 1 ? `<li class="flex-1 h-px ${d ? "bg-primary" : "bg-border"}"></li>` : ""}`).join("")}</ol>`;
}

function juryPage() {
  const list = DATA.issues.filter((i) => i.status === "resolved");
  return `<div class="p-6 max-w-5xl space-y-6"><div><h1 class="text-2xl font-semibold tracking-tight">Award review</h1><p class="text-sm text-muted-foreground mt-1">Decide on resolved issues. Recording an award does not change the contest clock. Staff confirm external application separately.</p></div>
  <div class="grid gap-4">${list.map((i) => { const t = teamOf(i); const a = i.award; return `<div class="rounded-xl border border-border bg-card p-5 grid md:grid-cols-[1fr_280px] gap-6">
    <div><div class="flex items-center gap-2 text-xs text-muted-foreground"><span class="font-mono">ISS-${i.number}</span>·${t.name}·${t.location}</div><div class="font-medium mt-1.5">${esc(i.description)}</div>
    <dl class="grid grid-cols-3 gap-3 mt-4 text-sm"><div><dt class="text-xs text-muted-foreground">Unresolved</dt><dd class="font-mono">${clock(elapsedMs(i))}</dd></div><div><dt class="text-xs text-muted-foreground">First assignment</dt><dd class="font-mono">${clock((i.created - i.first) * 60000)}</dd></div><div><dt class="text-xs text-muted-foreground">Resolved by</dt><dd>${i.owner}</dd></div></dl></div>
    <div class="rounded-lg border border-border p-4">${a ? ledgerCard(a) : `<div class="text-sm font-medium">Record a decision</div><div class="flex flex-wrap gap-1.5 mt-3">${[0, 5, 10, 15, 30].map((m) => `<button class="btn btn-outline btn-sm">${m} min</button>`).join("")}<button class="btn btn-outline btn-sm">Custom…</button></div><textarea class="mt-3 w-full rounded-md border border-input bg-transparent p-2 text-sm" rows="2" placeholder="Public explanation for the team"></textarea><button class="btn btn-primary btn-sm w-full justify-center mt-2">Record award</button>`}</div></div>`; }).join("")}</div></div>`;
}

function ledgerCard(a) {
  return `<div class="flex items-baseline justify-between"><div class="text-2xl font-semibold">+${a.minutes} min</div><span class="badge ${a.applied ? "s-resolved" : "s-escalated"}">${a.applied ? "Applied externally" : "Pending application"}</span></div><p class="text-sm text-muted-foreground mt-1">“${esc(a.explanation)}”</p>
  <ol class="mt-3 space-y-2 text-xs"><li class="flex gap-2"><i data-lucide="circle-check" class="s-resolved" style="width:14px"></i>Decided by ${a.by} · ${wallTime(a.at)}</li><li class="flex gap-2 ${a.applied ? "" : "text-muted-foreground"}"><i data-lucide="${a.applied ? "circle-check" : "circle-dashed"}" class="${a.applied ? "s-resolved" : ""}" style="width:14px"></i>${a.applied ? `Applied by ${a.applied.by} · ${wallTime(a.applied.at)}` : "Waiting for staff to apply it in the contest system"}</li></ol>
  ${a.applied ? "" : `<button class="btn btn-outline btn-sm w-full justify-center mt-3" data-action="apply"><i data-lucide="check-check"></i>Confirm applied externally</button>`}`;
}

function adminPage() {
  return `<div class="p-6 max-w-5xl space-y-6"><div class="flex items-end justify-between"><div><h1 class="text-2xl font-semibold tracking-tight">Accounts</h1><p class="text-sm text-muted-foreground mt-1">Team accounts are shared. Staff accounts belong to one person and combine their roles.</p></div><button class="btn btn-primary" data-action="create"><i data-lucide="user-plus"></i>Create account</button></div>
  <div class="flex gap-2"><div class="relative flex-1 max-w-xs"><i data-lucide="search" class="absolute left-3 top-2.5 text-muted-foreground"></i><input class="w-full h-9 pl-9 rounded-md border border-input bg-transparent text-sm" placeholder="Filter accounts…"></div><button class="btn btn-outline btn-sm border-dashed"><i data-lucide="circle-plus"></i>Role</button></div>
  <div class="rounded-xl border border-border overflow-hidden"><table class="w-full text-sm"><thead class="text-xs text-muted-foreground"><tr class="border-b border-border"><th class="px-4 h-10 text-left font-medium">Name</th><th class="text-left font-medium">Username</th><th class="text-left font-medium">Access</th><th class="w-12"></th></tr></thead><tbody>
  ${DATA.members.map((m) => `<tr class="row border-b border-border"><td class="px-4 py-3"><div class="flex items-center gap-3">${avatar(m.name, "size-8")}<span class="font-medium">${m.name}</span></div></td><td class="font-mono text-xs text-muted-foreground">${m.username}</td><td><div class="flex gap-1.5 flex-wrap">${m.team ? `<span class="badge"><i data-lucide="users" style="width:12px"></i>Contestant team</span>` : m.roles.map((r) => `<span class="badge capitalize">${r}</span>`).join("") + (m.admin ? `<span class="badge bg-primary text-primary-foreground border-transparent">Admin</span>` : "")}</div></td><td><button class="btn btn-ghost btn-sm"><i data-lucide="ellipsis"></i></button></td></tr>`).join("")}</tbody></table></div></div>`;
}

function settingsPage() {
  const s = DATA.session;
  const slider = (label, val, max, unit, help) => `<div><div class="flex justify-between text-sm"><label class="font-medium">${label}</label><span class="font-mono tabular-nums">${val}${unit}</span></div><input type="range" min="1" max="${max}" value="${val}" class="w-full mt-2" oninput="this.previousElementSibling.lastElementChild.textContent=this.value+'${unit}'"><p class="text-xs text-muted-foreground">${help}</p></div>`;
  return `<div class="p-6 max-w-3xl space-y-6"><div><h1 class="text-2xl font-semibold tracking-tight">Session settings</h1><p class="text-sm text-muted-foreground mt-1">These settings apply to ${s.name}.</p></div>
  <section class="rounded-xl border border-border bg-card"><div class="p-5 flex items-start justify-between gap-6"><div><h2 class="font-semibold">Contestant intake</h2><p class="text-sm text-muted-foreground mt-1">When intake is closed, teams cannot submit new reports. Staff can still report for a team and reopen issues.</p></div><button class="switch mt-1" role="switch" aria-checked="true" onclick="this.setAttribute('aria-checked', this.getAttribute('aria-checked')!=='true')"></button></div></section>
  <section class="rounded-xl border border-border bg-card"><div class="p-5 border-b border-border"><h2 class="font-semibold">Issue images</h2><p class="text-sm text-muted-foreground mt-1">JPEG, PNG and WebP. A lower limit does not remove images that are already attached.</p></div><div class="p-5 space-y-5">${slider("Largest single image", s.max_image_mb, 50, " MB", "Uploads above this size are refused.")}${slider("Images per issue", s.max_images, 24, "", "Counts team-visible and staff-only images together.")}${slider("Combined size per issue", s.max_total_mb, 120, " MB", "Total of all images on one issue.")}</div><div class="px-5 py-3 border-t border-border bg-muted/40 flex justify-end"><button class="btn btn-primary btn-sm">Save limits</button></div></section>
  <section class="rounded-xl border border-border bg-card p-5"><h2 class="font-semibold">Categories</h2><div class="flex flex-wrap gap-2 mt-3">${s.categories.map((c) => `<span class="badge">${c}</span>`).join("")}<span class="badge border-dashed text-muted-foreground">Editor planned</span></div></section></div>`;
}

function insightsPage() {
  const byCat = DATA.session.categories.map((c) => [c, DATA.issues.filter((i) => i.category === c).length]);
  const max = Math.max(...byCat.map((b) => b[1]));
  return `<div class="p-6 max-w-[1200px] space-y-6"><div><h1 class="text-2xl font-semibold tracking-tight">Overview</h1><p class="text-sm text-muted-foreground mt-1">Session health at a glance.</p></div>${statCards()}
  <div class="grid lg:grid-cols-2 gap-4"><div class="rounded-xl border border-border bg-card p-5"><h2 class="font-semibold text-sm">Reports by category</h2><div class="mt-4 space-y-3">${byCat.map(([c, n]) => `<div class="grid grid-cols-[140px_1fr_24px] items-center gap-3 text-sm" title="${c}: ${n}"><span class="text-muted-foreground">${c}</span><div class="h-2.5 rounded-full bg-muted overflow-hidden"><div class="h-full rounded-full bg-foreground/80" style="width:${(n / max) * 100}%"></div></div><span class="tabular-nums text-right">${n}</span></div>`).join("")}</div></div>
  <div class="rounded-xl border border-border bg-card p-5"><h2 class="font-semibold text-sm">Awards</h2><div class="grid grid-cols-3 gap-4 mt-4"><div><div class="text-3xl font-semibold">15</div><div class="text-xs text-muted-foreground">minutes decided</div></div><div><div class="text-3xl font-semibold">1</div><div class="text-xs text-muted-foreground">pending application</div></div><div><div class="text-3xl font-semibold">2</div><div class="text-xs text-muted-foreground">resolved, no decision</div></div></div></div></div></div>`;
}

function teamsPage() {
  return `<div class="p-6 max-w-5xl space-y-6"><div><h1 class="text-2xl font-semibold tracking-tight">Teams & tables</h1><p class="text-sm text-muted-foreground mt-1">Every team in this session, with its location and open reports.</p></div><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">${DATA.teams.map((t) => { const open = DATA.issues.filter((i) => i.team === t.id && i.status !== "resolved"); return `<div class="rounded-xl border border-border bg-card p-4"><div class="flex items-center justify-between"><span class="font-medium">${t.name}</span>${open.length ? `<span class="badge s-escalated">${open.length} unresolved</span>` : `<span class="badge text-muted-foreground">Clear</span>`}</div><div class="text-sm text-muted-foreground mt-1 flex items-center gap-1.5"><i data-lucide="map-pin" style="width:14px"></i>${t.location}</div></div>`; }).join("")}</div></div>`;
}

function render() {
  if (persona === "contestant" && !["help", "queue"].includes(route)) route = "help";
  if (persona === "jury" && !["awards", "ledger"].includes(route)) route = "awards";
  if (persona === "support" && !["queue", "mine", "handoffs", "teams"].includes(route)) route = "queue";
  if (persona === "admin" && !["queue", "admin", "settings", "insights"].includes(route)) route = "queue";
  renderChrome();
  const pages = { queue: () => queuePage("queue"), mine: () => queuePage("mine"), handoffs: () => queuePage("handoffs"), help: contestantHelp, awards: juryPage, ledger: juryPage, admin: adminPage, settings: settingsPage, insights: insightsPage, teams: teamsPage };
  $("#page").innerHTML = pages[route]();
  if (selected) renderSheet();
  icons();
}

function timeline(i) {
  const staff = persona !== "contestant";
  const items = (DATA.history[i.id] ?? []).filter((h) => staff || h.t !== "internal");
  return `<ol class="relative space-y-4 before:absolute before:left-[11px] before:top-2 before:bottom-2 before:w-px before:bg-border">${items.map((h) => {
    if (h.t === "event" || h.t === "reopen") return `<li class="relative flex gap-3 text-sm text-muted-foreground"><span class="size-6 rounded-full bg-background border border-border grid place-items-center z-10"><i data-lucide="${h.t === "reopen" ? "rotate-ccw" : "dot"}" style="width:12px"></i></span><span class="pt-0.5">${esc(h.text)} · ${wallTime(h.at)}</span></li>`;
    if (h.t === "resolve") return `<li class="relative flex gap-3 text-sm"><span class="size-6 rounded-full bg-emerald-500/15 text-emerald-500 grid place-items-center z-10"><i data-lucide="check" style="width:12px"></i></span><div class="flex-1 rounded-lg border border-emerald-500/30 p-3"><div class="text-xs text-muted-foreground">Resolved by ${h.who} · ${wallTime(h.at)} · visible to the team</div><div class="mt-1 font-medium">${esc(h.text)}</div></div></li>`;
    if (h.t === "award") return `<li class="relative flex gap-3 text-sm text-muted-foreground"><span class="size-6 rounded-full bg-background border border-border grid place-items-center z-10"><i data-lucide="scale" style="width:12px"></i></span><span class="pt-0.5">${h.who}: ${esc(h.text)} · ${wallTime(h.at)}</span></li>`;
    const internal = h.t === "internal";
    return `<li class="relative flex gap-3">${avatar(h.who)}<div class="flex-1 rounded-lg border border-border p-3 ${internal ? "internal" : ""}"><div class="flex items-center gap-2 text-xs"><span class="font-medium">${h.who}</span><span class="text-muted-foreground">${wallTime(h.at)}</span>${internal ? `<span class="ml-auto badge text-amber-500 border-amber-500/40"><i data-lucide="lock" style="width:11px"></i>Internal note</span>` : `<span class="ml-auto text-muted-foreground">Public reply</span>`}</div><p class="text-sm mt-1.5">${esc(h.text)}</p></div></li>`;
  }).join("")}</ol>`;
}

function lifecycle(i) {
  const order = ["open", "claimed", "escalated", "resolved"];
  const at = order.indexOf(i.status);
  const steps = [["Submitted", wallTime(i.created)], ["Claimed", i.first ? wallTime(i.first) : ""], ["Specialist", i.status === "escalated" ? "Requested" : at > 2 ? "" : ""], ["Resolved", i.resolved ? wallTime(i.resolved) : ""]];
  return `<div class="grid grid-cols-4 gap-1">${steps.map(([l, sub], n) => { const done = n <= at && !(n === 2 && i.status === "resolved" && !i.escalatedOnce); const cur = n === at; return `<div><div class="h-1.5 rounded-full ${n < at || (cur && i.status === "resolved") ? "bg-foreground" : cur ? "bg-foreground/60 animate-pulse" : "bg-muted"}"></div><div class="mt-2 text-xs ${done ? "" : "text-muted-foreground"} font-medium">${l}</div><div class="text-[11px] text-muted-foreground font-mono">${sub || "—"}</div></div>`; }).join("")}</div>`;
}

function renderSheet() {
  const i = DATA.issues.find((x) => x.id === selected);
  if (!i) return;
  const t = teamOf(i);
  const staff = persona !== "contestant";
  const imgs = (DATA.images[i.id] ?? []).filter((m) => staff || m.vis === "public");
  const primary = { open: `<button class="btn btn-primary" data-action="claim"><i data-lucide="hand"></i>Claim issue</button>`, claimed: `<button class="btn btn-primary" data-action="resolve"><i data-lucide="check"></i>Resolve…</button><button class="btn btn-outline" data-action="escalate"><i data-lucide="arrow-up-right"></i>Escalate</button>`, escalated: `<button class="btn btn-primary" data-action="accept"><i data-lucide="handshake"></i>Accept handoff</button>`, resolved: `<button class="btn btn-outline" data-action="reopen"><i data-lucide="rotate-ccw"></i>Reopen…</button>` }[i.status];
  $("#sheet").innerHTML = `<div class="p-5 border-b border-border"><div class="flex items-center gap-2"><span class="font-mono text-xs text-muted-foreground">ISS-${i.number}</span>${statusBadge(i.status)}<span class="badge text-muted-foreground">${i.category}</span><div class="flex-1"></div><button class="btn btn-ghost btn-sm" data-action="close" aria-label="Close"><i data-lucide="x"></i></button></div>
    <h2 class="text-lg font-semibold mt-3 leading-snug">${esc(i.description)}</h2>
    <div class="flex items-center gap-4 text-sm text-muted-foreground mt-2"><span class="flex items-center gap-1.5"><i data-lucide="users" style="width:14px"></i>${t.name}</span><span class="flex items-center gap-1.5"><i data-lucide="map-pin" style="width:14px"></i>${t.location}</span></div>
    <div class="grid grid-cols-3 gap-3 mt-5"><div class="rounded-lg border border-border p-3"><div class="text-xs text-muted-foreground flex items-center gap-1.5">${i.status !== "resolved" ? `<span class="size-1.5 rounded-full bg-emerald-500 animate-pulse"></span>Running` : "Stopped"}</div><div class="font-mono text-xl mt-1 tabular-nums age-${age(i)}" data-timer="${i.id}">${clock(elapsedMs(i))}</div><div class="text-[11px] text-muted-foreground">unresolved time</div></div>
    <div class="rounded-lg border border-border p-3"><div class="text-xs text-muted-foreground">First assignment</div><div class="font-mono text-xl mt-1">${i.first ? clock((i.created - i.first) * 60000) : "—"}</div><div class="text-[11px] text-muted-foreground">after submission</div></div>
    <div class="rounded-lg border border-border p-3"><div class="text-xs text-muted-foreground">Owner</div><div class="flex items-center gap-2 mt-1.5">${avatar(i.owner)}<span class="text-sm font-medium truncate">${i.owner ?? "Unassigned"}</span></div></div></div>
    <div class="mt-5">${lifecycle(i)}</div>
    ${i.status === "escalated" ? `<div class="mt-4 rounded-lg border border-amber-500/40 bg-amber-500/10 p-3 text-sm flex gap-3"><i data-lucide="arrow-up-right" class="text-amber-500 mt-0.5"></i><div><div class="font-medium">Specialist handoff requested</div><div class="text-muted-foreground">${i.owner} stays responsible until a specialist accepts.</div></div></div>` : ""}
    ${staff ? `<div class="flex gap-2 mt-4">${primary}</div>` : ""}</div>
    <div class="px-5 pt-3 border-b border-border flex gap-5 text-sm">${[["activity", "Activity", (DATA.history[i.id] ?? []).length], ["images", "Images", imgs.length], ["outcome", "Outcome & award", ""]].map(([k, l, n]) => `<button data-sheettab="${k}" class="pb-2.5 -mb-px border-b-2 ${sheetTab === k ? "border-foreground font-medium" : "border-transparent text-muted-foreground"}">${l}${n !== "" ? ` <span class="text-xs text-muted-foreground">${n}</span>` : ""}</button>`).join("")}</div>
    <div class="flex-1 overflow-y-auto p-5">${sheetTab === "activity" ? timeline(i) : sheetTab === "images" ? imagesTab(imgs, staff) : outcomeTab(i)}</div>
    ${sheetTab === "activity" && i.status !== "resolved" ? composerHtml(i, staff) : ""}`;
  icons();
}

function imagesTab(imgs, staff) {
  return `<div class="grid grid-cols-3 gap-3">${imgs.map((m) => `<figure class="rounded-lg border border-border overflow-hidden"><div class="aspect-[4/3]" style="background:linear-gradient(135deg,hsl(${m.hue} 60% 45%),hsl(${m.hue + 40} 60% 25%))"></div><figcaption class="p-2 text-xs"><div class="truncate font-medium">${m.name}</div><div class="flex items-center gap-1 text-muted-foreground mt-0.5">${m.vis === "internal" ? `<i data-lucide="lock" style="width:11px"></i>Staff only` : `<i data-lucide="eye" style="width:11px"></i>Team can see`}</div></figcaption></figure>`).join("")}
  ${staff ? `<label class="rounded-lg border border-dashed border-border grid place-items-center aspect-[4/3] text-xs text-muted-foreground cursor-pointer hover:bg-accent"><div class="text-center"><i data-lucide="image-plus" class="mx-auto mb-1"></i>Add image<div class="text-[10px]">≤ 8 MB · 6 per issue</div></div></label>` : ""}</div>
  ${staff ? `<p class="text-xs text-muted-foreground mt-4">You choose the audience when you upload. It cannot change later. Only the uploader can remove an image.</p>` : ""}`;
}

function outcomeTab(i) {
  if (i.status !== "resolved") return `<div class="text-sm text-muted-foreground text-center py-10"><i data-lucide="hourglass" class="mx-auto mb-2"></i>This issue is not resolved yet. The resolution summary and any time award appear here.</div>`;
  return `<div class="space-y-4"><div class="rounded-lg border border-border p-4"><div class="text-xs text-muted-foreground">Resolution summary · visible to the team</div><div class="font-medium mt-1">${(DATA.history[i.id] ?? []).find((h) => h.t === "resolve")?.text ?? "Resolved"}</div><div class="text-xs text-muted-foreground mt-2">By ${i.owner} · ${wallTime(i.resolved)}</div></div>
  <div class="rounded-lg border border-border p-4">${i.award ? ledgerCard(i.award) : `<div class="text-sm text-muted-foreground">No award decision yet. Awards are discretionary and come from the jury.</div>`}</div></div>`;
}

function composerHtml(i, staff) {
  const internal = composer === "internal";
  return `<div class="border-t border-border p-4"><div class="rounded-xl border border-border ${internal ? "internal" : ""}">
    <textarea class="w-full bg-transparent p-3 text-sm outline-none resize-none" rows="3" placeholder="${internal ? "Internal note. Only staff can see this." : `Reply to ${teamOf(i).name}…`}"></textarea>
    <div class="flex items-center gap-2 p-2">${staff ? `<div class="inline-flex rounded-lg bg-muted p-0.5 text-xs"><button data-composer="public" class="px-2.5 h-7 rounded-md flex items-center gap-1.5 ${!internal ? "bg-background shadow" : "text-muted-foreground"}"><i data-lucide="eye" style="width:13px"></i>Public reply</button><button data-composer="internal" class="px-2.5 h-7 rounded-md flex items-center gap-1.5 ${internal ? "bg-background shadow text-amber-500" : "text-muted-foreground"}"><i data-lucide="lock" style="width:13px"></i>Internal note</button></div>` : ""}<button class="btn btn-ghost btn-sm" aria-label="Attach image"><i data-lucide="paperclip"></i></button><div class="flex-1"></div><span class="kbd">⌘↵</span><button class="btn btn-primary btn-sm">${internal ? "Add note" : "Send"}</button></div></div></div>`;
}

function openSheet(id) { selected = id; sheetTab = "activity"; $("#overlay").classList.remove("hidden"); $("#sheet").classList.remove("translate-x-full"); render(); }
function closeSheet() { selected = null; $("#overlay").classList.add("hidden"); $("#sheet").classList.add("translate-x-full"); render(); }

function renderCmd(q) {
  const teams = DATA.teams.filter((t) => !q || fuzzy(q, t.name + " " + t.location)).slice(0, 5);
  const issues = DATA.issues.filter((i) => !q || fuzzy(q, `iss ${i.number} ${i.number} ${i.description} ${i.category}`)).slice(0, 4);
  const actions = [["plus", "Report an issue for a team"], ["hand", "Claim oldest open issue"], ["power", "Close contestant intake"]].filter(([, l]) => !q || fuzzy(q, l));
  const group = (title, html) => html ? `<div class="px-2 pt-2 pb-1 text-xs text-muted-foreground font-medium">${title}</div>${html}` : "";
  $("#cmd-list").innerHTML = group("Teams", teams.map((t) => { const n = DATA.issues.filter((i) => i.team === t.id && i.status !== "resolved").length; return `<button class="w-full flex items-center gap-3 rounded-md px-2 h-10 hover:bg-accent text-left"><i data-lucide="users"></i><span class="font-medium">${t.name}</span><span class="text-muted-foreground">${t.location}</span>${n ? `<span class="ml-auto badge s-escalated">${n} unresolved</span>` : ""}</button>`; }).join("")) +
    group("Issues", issues.map((i) => `<button data-cmd-issue="${i.id}" class="w-full flex items-center gap-3 rounded-md px-2 h-10 hover:bg-accent text-left"><i data-lucide="${STATUS[i.status].icon}" class="s-${i.status}"></i><span class="font-mono text-xs text-muted-foreground">ISS-${i.number}</span><span class="truncate">${esc(i.description)}</span></button>`).join("")) +
    group("Actions", actions.map(([ic, l]) => `<button class="w-full flex items-center gap-3 rounded-md px-2 h-10 hover:bg-accent text-left"><i data-lucide="${ic}"></i>${l}</button>`).join("")) || `<div class="py-10 text-center text-muted-foreground">No matches.</div>`;
  icons();
}
function openCmd() { $("#cmd").classList.remove("hidden"); $("#cmd-input").value = ""; renderCmd(""); $("#cmd-input").focus(); }

function dialog(html) { $("#dialog-body").innerHTML = html; $("#dialog").classList.remove("hidden"); icons(); }
const DIALOGS = {
  create: `<h2 class="text-lg font-semibold">Create account</h2><p class="text-sm text-muted-foreground mt-1">You get a temporary password to share in person. The user changes it at first sign-in.</p>
    <div class="space-y-3 mt-5 text-sm"><label class="block"><span class="font-medium">Display name</span><input class="mt-1.5 w-full h-9 rounded-md border border-input bg-transparent px-3" placeholder="Team Aurora or Alex Morgan"></label><label class="block"><span class="font-medium">Username</span><input class="mt-1.5 w-full h-9 rounded-md border border-input bg-transparent px-3 font-mono" placeholder="team-aurora"></label>
    <div><span class="font-medium">Account type</span><div class="grid grid-cols-2 gap-2 mt-1.5"><button class="rounded-lg border border-border p-3 text-left ring-2 ring-ring"><i data-lucide="user-round"></i><div class="font-medium mt-1">Staff member</div><div class="text-xs text-muted-foreground">One person, several roles</div></button><button class="rounded-lg border border-border p-3 text-left"><i data-lucide="users"></i><div class="font-medium mt-1">Contestant team</div><div class="text-xs text-muted-foreground">Shared by the team</div></button></div></div>
    <div class="flex flex-wrap gap-2">${["Volunteer", "Specialist", "Jury", "Admin"].map((r, n) => `<label class="badge cursor-pointer h-7 ${n === 0 ? "bg-accent" : ""}"><input type="checkbox" ${n === 0 ? "checked" : ""} class="accent-current">${r}</label>`).join("")}</div></div>
    <div class="flex justify-end gap-2 mt-6"><button class="btn btn-outline" data-close>Cancel</button><button class="btn btn-primary" data-action="credentials">Create account</button></div>`,
  credentials: `<div class="size-10 rounded-full bg-emerald-500/15 text-emerald-500 grid place-items-center"><i data-lucide="key-round"></i></div><h2 class="text-lg font-semibold mt-3">Share these credentials securely</h2><p class="text-sm text-muted-foreground mt-1">This password appears only once. If it is lost, issue a new one.</p>
    <div class="mt-4 rounded-lg border border-border divide-y divide-border font-mono text-sm"><div class="flex items-center justify-between p-3"><span class="text-muted-foreground font-sans text-xs">Username</span>alex-morgan<i data-lucide="copy" class="text-muted-foreground"></i></div><div class="flex items-center justify-between p-3"><span class="text-muted-foreground font-sans text-xs">Temporary password</span>tulip-orbit-7319<i data-lucide="copy" class="text-muted-foreground"></i></div></div>
    <div class="flex justify-end mt-6"><button class="btn btn-primary" data-close>I have shared them</button></div>`,
  resolve: `<h2 class="text-lg font-semibold">Resolve ISS-29</h2><p class="text-sm text-muted-foreground mt-1">The team sees this summary. The timer stops.</p><div class="space-y-2 mt-4">${["Service restored", "Device issue resolved", "Problem statement clarified", "Resolved without comment"].map((r, n) => `<label class="flex items-center gap-3 rounded-lg border border-border p-3 text-sm cursor-pointer hover:bg-accent"><input type="radio" name="r" ${n === 0 ? "checked" : ""}>${r}</label>`).join("")}<label class="flex items-center gap-3 rounded-lg border border-border p-3 text-sm"><input type="radio" name="r">Write a custom summary…</label></div><div class="flex justify-end gap-2 mt-6"><button class="btn btn-outline" data-close>Cancel</button><button class="btn btn-primary" data-close>Resolve issue</button></div>`,
  report: `<h2 class="text-lg font-semibold">Report for a team</h2><p class="text-sm text-muted-foreground mt-1">Staff can report even when contestant intake is closed.</p><div class="space-y-3 mt-4 text-sm"><label class="block"><span class="font-medium">Affected team</span><div class="mt-1.5 h-9 rounded-md border border-input px-3 flex items-center gap-2"><i data-lucide="search" class="text-muted-foreground"></i><span class="text-muted-foreground">Search name or table — try “hall b 9”</span></div></label><label class="block"><span class="font-medium">Category</span><select class="mt-1.5 w-full h-9 rounded-md border border-input bg-transparent px-2">${DATA.session.categories.map((c) => `<option>${c}</option>`).join("")}</select></label><label class="block"><span class="font-medium">What is happening?</span><textarea class="mt-1.5 w-full rounded-md border border-input bg-transparent p-2" rows="3"></textarea></label></div><div class="flex justify-end gap-2 mt-6"><button class="btn btn-outline" data-close>Cancel</button><button class="btn btn-primary" data-close>Submit issue</button></div>`,
};

document.addEventListener("click", (e) => {
  const el = (s) => e.target.closest(s);
  if (el("[data-persona]")) { persona = el("[data-persona]").dataset.persona; route = ""; closeSheet(); return; }
  if (el("[data-route]")) { e.preventDefault(); route = el("[data-route]").dataset.route; render(); return; }
  if (el("[data-tab]")) { tab = el("[data-tab]").dataset.tab; render(); return; }
  if (el("[data-cmd-issue]")) { $("#cmd").classList.add("hidden"); openSheet(el("[data-cmd-issue]").dataset.cmdIssue); return; }
  if (el("[data-issue]")) { openSheet(el("[data-issue]").dataset.issue); return; }
  if (el("[data-sheettab]")) { sheetTab = el("[data-sheettab]").dataset.sheettab; renderSheet(); return; }
  if (el("[data-composer]")) { composer = el("[data-composer]").dataset.composer; renderSheet(); return; }
  if (el("#overlay") || el("[data-action=close]")) { closeSheet(); return; }
  if (el("#open-cmd") || el("[data-action=cmd]")) { openCmd(); return; }
  if (el("#cmd [data-close]")) { $("#cmd").classList.add("hidden"); return; }
  if (el("#dialog [data-close]")) { $("#dialog").classList.add("hidden"); return; }
  const a = el("[data-action]")?.dataset.action;
  if (a && DIALOGS[a]) dialog(DIALOGS[a]);
  if (el("#theme")) document.documentElement.classList.toggle("dark");
  if (el("#intake-switch")) { const s = $("#intake-switch"); const on = s.getAttribute("aria-checked") !== "true"; s.setAttribute("aria-checked", on); $("#intake-text").textContent = on ? "Teams can submit new reports." : "Closed. Staff can still report for a team."; }
});
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openCmd(); }
  if (e.key === "Escape") { $("#cmd").classList.add("hidden"); $("#dialog").classList.add("hidden"); if (selected) closeSheet(); }
});
$("#cmd-input").addEventListener("input", (e) => renderCmd(e.target.value));
setInterval(() => document.querySelectorAll("[data-timer]").forEach((n) => { const i = DATA.issues.find((x) => x.id === n.dataset.timer); n.textContent = clock(elapsedMs(i)); }), 1000);
render();
</script>
</body>
</html>
