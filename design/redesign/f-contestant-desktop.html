<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Minsky · Contestant app (desktop)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<script>
tailwind.config = {
  darkMode: "class",
  theme: { extend: {
    fontFamily: { sans: ["Inter", "sans-serif"], mono: ["JetBrains Mono", "monospace"] },
    colors: {
      border: "hsl(var(--border))", input: "hsl(var(--input))", ring: "hsl(var(--ring))",
      background: "hsl(var(--background))", foreground: "hsl(var(--foreground))",
      primary: { DEFAULT: "hsl(var(--primary))", foreground: "hsl(var(--primary-foreground))" },
      muted: { DEFAULT: "hsl(var(--muted))", foreground: "hsl(var(--muted-foreground))" },
      accent: { DEFAULT: "hsl(var(--accent))", foreground: "hsl(var(--accent-foreground))" },
      card: "hsl(var(--card))", sidebar: "hsl(var(--sidebar))",
    },
  } },
};
</script>
<style>
  :root { --background: 0 0% 100%; --foreground: 240 10% 3.9%; --card: 0 0% 100%; --sidebar: 0 0% 98%; --muted: 240 4.8% 95.9%; --muted-foreground: 240 3.8% 46.1%; --accent: 240 4.8% 95.9%; --accent-foreground: 240 5.9% 10%; --primary: 240 5.9% 10%; --primary-foreground: 0 0% 98%; --border: 240 5.9% 90%; --input: 240 5.9% 90%; --ring: 240 5% 64.9%; }
  .dark { --background: 240 10% 3.9%; --foreground: 0 0% 98%; --card: 240 10% 5.5%; --sidebar: 240 6% 7%; --muted: 240 3.7% 15.9%; --muted-foreground: 240 5% 64.9%; --accent: 240 3.7% 15.9%; --accent-foreground: 0 0% 98%; --primary: 0 0% 98%; --primary-foreground: 240 5.9% 10%; --border: 240 3.7% 15.9%; --input: 240 3.7% 15.9%; --ring: 240 4.9% 83.9%; }
  [data-lucide] { width: 16px; height: 16px; stroke-width: 2; flex-shrink: 0; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; height:2.25rem; padding:0 .875rem; border-radius:.5rem; font-size:.875rem; font-weight:500; transition: background .15s, opacity .15s; white-space:nowrap; }
  .btn-primary { background:hsl(var(--primary)); color:hsl(var(--primary-foreground)); } .btn-primary:hover { opacity:.9; }
  .btn-outline { border:1px solid hsl(var(--border)); background:hsl(var(--background)); } .btn-outline:hover, .btn-ghost:hover { background:hsl(var(--accent)); }
  .btn-lg { height:3rem; border-radius:.75rem; font-size:1rem; font-weight:600; }
  .btn-sm { height:2rem; padding:0 .625rem; font-size:.8125rem; }
  .badge { display:inline-flex; align-items:center; gap:.3rem; border-radius:9999px; padding:.125rem .55rem; font-size:.75rem; font-weight:500; border:1px solid hsl(var(--border)); white-space:nowrap; }
  .s-open { color:#2563eb; } .s-claimed { color:#7c3aed; } .s-escalated { color:#b45309; } .s-resolved { color:#047857; }
  .dark .s-open { color:#60a5fa; } .dark .s-claimed { color:#a78bfa; } .dark .s-escalated { color:#fbbf24; } .dark .s-resolved { color:#34d399; }
  .age-fresh { color:hsl(var(--muted-foreground)); } .age-warn { color:#d97706; } .age-crit { color:#e11d48; } .age-done { color:hsl(var(--muted-foreground)); }
  .dark .age-warn { color:#f59e0b; } .dark .age-crit { color:#fb7185; }
  .internal { background: repeating-linear-gradient(135deg, rgb(245 158 11 / .07) 0 8px, transparent 8px 16px); border-color: rgb(245 158 11 / .45) !important; }
  .switch { width:2.75rem; height:1.5rem; border-radius:9999px; background:hsl(var(--input)); position:relative; transition:background .2s; flex-shrink:0; }
  .switch::after { content:""; position:absolute; top:2px; left:2px; width:1.25rem; height:1.25rem; border-radius:9999px; background:hsl(var(--background)); box-shadow: 0 1px 2px rgb(0 0 0 / .2); transition: transform .2s; }
  .switch[aria-checked="true"] { background:#10b981; } .switch[aria-checked="true"]::after { transform: translateX(1.25rem); }
  .seg { display:inline-flex; border-radius:.5rem; background:hsl(var(--muted)); padding:.2rem; }
  .seg > button { border-radius:.375rem; padding:0 .75rem; height:2rem; font-size:.8125rem; font-weight:500; color:hsl(var(--muted-foreground)); }
  .seg > button[aria-pressed="true"] { background:hsl(var(--background)); color:hsl(var(--foreground)); box-shadow:0 1px 2px rgb(0 0 0 / .12); }
  .kbd { font-family: "JetBrains Mono", monospace; font-size:.6875rem; border:1px solid hsl(var(--border)); border-radius:.25rem; padding:0 .3rem; color:hsl(var(--muted-foreground)); }
  input, textarea, select { background: transparent; }
  .field { width:100%; border:1px solid hsl(var(--input)); border-radius:.5rem; padding:.5rem .75rem; font-size:.9375rem; outline:none; }
  .field:focus { box-shadow: 0 0 0 2px hsl(var(--ring)); }
</style>

<style>
  body { font-feature-settings: "cv11", "ss01"; }
  .item[aria-current="true"] { background: hsl(var(--accent)); }
  .tile:has(:checked) { border-color: hsl(var(--primary)); box-shadow: 0 0 0 1px hsl(var(--primary)); }
</style>
</head>
<body class="bg-background text-foreground font-sans antialiased">
<div class="h-screen flex flex-col">
  <header class="h-14 shrink-0 border-b border-border flex items-center gap-4 px-5">
    <div class="flex items-center gap-2.5"><div class="size-8 rounded-lg bg-primary text-primary-foreground grid place-items-center font-bold">M</div><div class="leading-tight"><div class="text-sm font-semibold">Minsky</div><div class="text-xs text-muted-foreground">Northern Informatics Open · Finals, contest day</div></div></div>
    <div class="flex-1"></div>
    <span class="badge"><span class="size-2 rounded-full bg-emerald-500"></span>Live</span>
    <label class="flex items-center gap-2 text-xs text-muted-foreground" title="Mockup only"><span>Preview: intake</span><button class="switch" role="switch" aria-checked="true" id="intake" aria-label="Preview intake open"></button></label>
    <button class="btn btn-ghost btn-sm" id="theme" aria-label="Toggle theme"><i data-lucide="sun-moon"></i></button>
    <div class="h-6 w-px bg-border"></div>
    <button class="flex items-center gap-2.5 rounded-lg px-2 py-1 hover:bg-accent"><span class="size-8 rounded-full bg-muted grid place-items-center text-xs font-semibold">TA</span><span class="text-left leading-tight"><span class="block text-sm font-medium">Team Aurora</span><span class="block text-xs text-muted-foreground">Hall A · Table 4</span></span><i data-lucide="chevron-down" class="text-muted-foreground"></i></button>
  </header>
  <div class="flex-1 min-h-0 grid grid-cols-[320px_1fr]">
    <aside class="border-r border-border flex flex-col min-h-0 bg-sidebar">
      <div class="p-4"><button class="btn btn-primary w-full h-10" data-new><i data-lucide="plus"></i>Report an issue</button><p class="text-xs text-muted-foreground mt-2 text-center" id="intake-note"></p></div>
      <div class="px-4 pb-2 text-xs font-medium text-muted-foreground">Your reports</div>
      <nav class="flex-1 overflow-y-auto px-2 space-y-1" id="list"></nav>
      <div class="p-4 border-t border-border text-xs text-muted-foreground flex items-center gap-2"><i data-lucide="key-round"></i><a href="#" class="hover:underline">Change password</a><span class="flex-1"></span><a href="#" class="hover:underline">Sign out</a></div>
    </aside>
    <main class="overflow-y-auto" id="main"></main>
  </div>
</div>
<script>
// Fictional sample data shared by every mockup. Times are relative to page load.
const NOW0 = Date.now();
const ago = (m) => new Date(NOW0 - m * 60000).toISOString();
const DATA = {
  event: { name: "Northern Informatics Open 2026", archived: false },
  sessions: ["Finals · Contest day", "Finals · Practice round"],
  session: { name: "Finals · Contest day", intake_open: true, categories: ["Workstation", "Network", "Judge system", "Problem statement", "Printing", "Other"], max_image_mb: 8, max_images: 6, max_total_mb: 30 },
  me: { name: "Priya Raman", initials: "PR", roles: ["volunteer", "specialist"], admin: true },
  teams: [
    { id: "t1", name: "Team Aurora", location: "Hall A · Table 4", x: 1, y: 1 },
    { id: "t2", name: "Byte Bandits", location: "Hall A · Table 7", x: 4, y: 1 },
    { id: "t3", name: "Null Pointers", location: "Hall A · Table 12", x: 3, y: 3 },
    { id: "t4", name: "Segfault Society", location: "Hall B · Table 2", x: 7, y: 1 },
    { id: "t5", name: "Off By One", location: "Hall B · Table 9", x: 8, y: 3 },
    { id: "t6", name: "Café Lambda", location: "Hall B · Table 15", x: 6, y: 4 },
    { id: "t7", name: "Greedy Goblins", location: "Hall A · Table 18", x: 1, y: 4 },
    { id: "t8", name: "Heap Heroes", location: "Hall B · Table 21", x: 9, y: 5 },
    { id: "t9", name: "Recursive Rabbits", location: "Hall A · Table 22", x: 4, y: 5 },
  ],
  people: { "Priya Raman": "PR", "Marcus Lee": "ML", "Sofia Ortega": "SO", "Dev Patel": "DP", "Hana Kim": "HK" },
  issues: [
    { id: "i31", number: 31, team: "t3", category: "Workstation", description: "Keyboard stopped responding after the IDE froze. Mouse still works.", status: "open", created: 2.2, first: null, owner: null, reporter: "Null Pointers" },
    { id: "i30", number: 30, team: "t5", category: "Judge system", description: "Submission stuck on “Judging” for problem C for over ten minutes.", status: "escalated", created: 14.5, first: 12.9, owner: "Marcus Lee", reporter: "Off By One" },
    { id: "i29", number: 29, team: "t1", category: "Network", description: "Cannot reach the contest site. Browser shows a connection reset.", status: "claimed", created: 9.1, first: 7.4, owner: "Priya Raman", reporter: "Team Aurora" },
    { id: "i28", number: 28, team: "t6", category: "Printing", description: "Print request from 10:42 never arrived at our table.", status: "claimed", created: 23.8, first: 21.0, owner: "Sofia Ortega", reporter: "Café Lambda" },
    { id: "i27", number: 27, team: "t2", category: "Problem statement", description: "Sample output for problem E contradicts the constraints in section 2.", status: "open", created: 5.6, first: null, owner: null, reporter: "Dev Patel" },
    { id: "i26", number: 26, team: "t4", category: "Workstation", description: "Monitor flickers and goes black every few minutes.", status: "resolved", created: 48, first: 46.5, owner: "Priya Raman", reporter: "Segfault Society", resolved: 31, award: { minutes: 10, explanation: "Workstation replaced; 17 minutes lost.", by: "Hana Kim", at: 25, applied: null } },
    { id: "i25", number: 25, team: "t7", category: "Network", description: "Intermittent packet loss when submitting large files.", status: "resolved", created: 72, first: 70, owner: "Marcus Lee", reporter: "Greedy Goblins", resolved: 52, award: { minutes: 5, explanation: "Brief outage confirmed by network team.", by: "Hana Kim", at: 44, applied: { by: "Dev Patel", at: 40 } } },
    { id: "i24", number: 24, team: "t8", category: "Other", description: "Chair is broken and the table is wobbling.", status: "resolved", created: 95, first: 93, owner: "Sofia Ortega", reporter: "Heap Heroes", resolved: 88 },
    { id: "i23", number: 23, team: "t9", category: "Judge system", description: "Scoreboard shows our accepted solution as wrong answer.", status: "claimed", created: 31, first: 29.5, owner: "Marcus Lee", reporter: "Recursive Rabbits", reopened: true },
  ],
  history: {
    i31: [{ t: "event", text: "Submitted by Null Pointers", at: 2.2 }],
    i30: [
      { t: "event", text: "Submitted by Off By One", at: 14.5 },
      { t: "event", text: "Claimed by Marcus Lee", at: 12.9 },
      { t: "public", who: "Marcus Lee", text: "We can see the submission in the queue. Checking the judge host now.", at: 11.2 },
      { t: "internal", who: "Marcus Lee", text: "Judge host 3 has a stuck worker. Needs a specialist to restart it safely.", at: 9.0 },
      { t: "event", text: "Marcus Lee requested a specialist handoff", at: 8.8 },
    ],
    i29: [
      { t: "event", text: "Submitted by Team Aurora", at: 9.1 },
      { t: "event", text: "Claimed by Priya Raman", at: 7.4 },
      { t: "public", who: "Priya Raman", text: "On my way to Table 4.", at: 7.2 },
      { t: "internal", who: "Priya Raman", text: "Cable looks loose at the switch. Swapping the port first.", at: 3.1 },
      { t: "public", who: "Team Aurora", text: "Thanks! It came back for a second, then dropped again.", at: 2.4 },
    ],
    i28: [{ t: "event", text: "Submitted by Café Lambda", at: 23.8 }, { t: "event", text: "Claimed by Sofia Ortega", at: 21.0 }, { t: "public", who: "Sofia Ortega", text: "Checking the print queue now.", at: 20.1 }],
    i27: [{ t: "event", text: "Submitted by Dev Patel for Byte Bandits", at: 5.6 }],
    i26: [
      { t: "event", text: "Submitted by Segfault Society", at: 48 },
      { t: "event", text: "Claimed by Priya Raman", at: 46.5 },
      { t: "internal", who: "Priya Raman", text: "Spare workstation W-17 is ready. Moving the team's session over.", at: 40 },
      { t: "resolve", who: "Priya Raman", text: "Device issue resolved", at: 31 },
      { t: "award", who: "Hana Kim", text: "10 minutes awarded", at: 25 },
    ],
    i25: [{ t: "event", text: "Submitted by Greedy Goblins", at: 72 }, { t: "resolve", who: "Marcus Lee", text: "Service restored", at: 52 }, { t: "award", who: "Hana Kim", text: "5 minutes awarded", at: 44 }, { t: "event", text: "Dev Patel confirmed the award was applied externally", at: 40 }],
    i24: [{ t: "event", text: "Submitted by Heap Heroes", at: 95 }, { t: "resolve", who: "Sofia Ortega", text: "Resolved without comment", at: 88 }],
    i23: [
      { t: "event", text: "Submitted by Recursive Rabbits", at: 31 },
      { t: "resolve", who: "Marcus Lee", text: "Problem statement clarified", at: 22 },
      { t: "reopen", who: "Recursive Rabbits", text: "Reopened: the verdict is still wrong after the rejudge.", at: 12 },
      { t: "internal", who: "Marcus Lee", text: "Rejudge job failed silently. Asking the judge team.", at: 6 },
    ],
  },
  images: {
    i29: [{ name: "switch-port.jpg", who: "Priya Raman", vis: "internal", hue: 200 }, { name: "error-page.png", who: "Priya Raman", vis: "public", hue: 340 }],
    i26: [{ name: "monitor.webp", who: "Priya Raman", vis: "public", hue: 30 }],
  },
  members: [
    { name: "Priya Raman", username: "priya", roles: ["volunteer", "specialist"], admin: true },
    { name: "Marcus Lee", username: "marcus", roles: ["volunteer"], admin: false },
    { name: "Sofia Ortega", username: "sofia", roles: ["volunteer"], admin: false },
    { name: "Dev Patel", username: "dev", roles: ["specialist"], admin: false },
    { name: "Hana Kim", username: "hana", roles: ["jury"], admin: false },
    { name: "Team Aurora", username: "team-aurora", team: "Team Aurora" },
    { name: "Byte Bandits", username: "byte-bandits", team: "Byte Bandits" },
    { name: "Null Pointers", username: "null-pointers", team: "Null Pointers" },
  ],
};
const STATUS = {
  open: { label: "Open", icon: "circle-dashed" },
  claimed: { label: "In progress", icon: "circle-dot" },
  escalated: { label: "Awaiting specialist", icon: "arrow-up-right" },
  resolved: { label: "Resolved", icon: "circle-check" },
};
const teamOf = (issue) => DATA.teams.find((t) => t.id === issue.team);
// Unresolved time: from creation to now, or to resolution.
const elapsedMs = (issue) => ((issue.status === "resolved" ? issue.created - issue.resolved : issue.created) * 60000) + (issue.status === "resolved" ? 0 : Date.now() - NOW0);
const clock = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600); const m = Math.floor((s % 3600) / 60); const r = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : String(m)) + ":" + String(r).padStart(2, "0"); };
const relTime = (m) => m < 1 ? "just now" : m < 60 ? Math.round(m) + "m ago" : Math.floor(m / 60) + "h " + Math.round(m % 60) + "m ago";
const wallTime = (m) => new Date(NOW0 - m * 60000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
const initials = (n) => n.split(/\s+/).slice(0, 2).map((p) => p[0]).join("").toUpperCase();
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// Aging tier for live timers: fresh < 10 min, warning < 20 min, critical after.
const age = (issue) => issue.status === "resolved" ? "done" : elapsedMs(issue) < 600000 ? "fresh" : elapsedMs(issue) < 1200000 ? "warn" : "crit";
// Small fuzzy match: every query token must prefix-match a word in name or location.
const fuzzy = (q, s) => { const words = s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").split(/[^a-z0-9]+/); return q.toLowerCase().split(/\s+/).filter(Boolean).every((tok) => words.some((w) => w.startsWith(tok))); };

// The contestant sees only their own team's issues, and only public activity and images.
const MINE = [
  DATA.issues.find((i) => i.id === "i29"),
  { ...DATA.issues.find((i) => i.id === "i26"), team: "t1", reporter: "Team Aurora" },
];
DATA.history.i26 = DATA.history.i26.map((h) => h.t === "event" ? { ...h, text: h.text.replace("Segfault Society", "Team Aurora") } : h);
let sel = "i29", intakeOpen = true, cat = 0;
const $ = (s) => document.querySelector(s);
const statusBadge = (s) => `<span class="badge s-${s}"><i data-lucide="${STATUS[s].icon}" style="width:12px;height:12px"></i>${s === "escalated" ? "With a specialist" : STATUS[s].label}</span>`;
const CAT_ICONS = ["monitor", "wifi", "gavel", "file-text", "printer", "circle-help"];
const CAT_HELP = ["Keyboard, mouse, screen, IDE", "Cannot reach the contest site", "Submissions or verdicts", "Questions about a problem", "Print requests", "Anything else"];

function list() {
  $("#list").innerHTML = MINE.map((i) => `<button data-sel="${i.id}" aria-current="${sel === i.id}" class="item w-full text-left rounded-lg p-3 hover:bg-accent"><div class="flex items-center gap-2">${statusBadge(i.status)}<span class="ml-auto font-mono text-xs tabular-nums ${i.status === "resolved" ? "text-muted-foreground" : ""}" data-timer="${i.id}">${clock(elapsedMs(i))}</span></div><div class="text-sm font-medium mt-2 line-clamp-2">${esc(i.description)}</div><div class="text-xs text-muted-foreground mt-1">ISS-${i.number} · ${i.category} · ${relTime(i.created)}</div></button>`).join("");
  $("#intake-note").innerHTML = intakeOpen ? "A helper comes to your table." : "Reporting is closed by the organisers.";
  document.querySelector("[data-new]").disabled = !intakeOpen;
  document.querySelector("[data-new]").style.opacity = intakeOpen ? 1 : .5;
}

function tracker(i) {
  const steps = [
    ["send", "Sent", wallTime(i.created), true],
    ["footprints", "Helper assigned", i.owner ? `${i.owner} · ${wallTime(i.first)}` : "Waiting for a helper", !!i.owner],
    ["circle-check", "Resolved", i.resolved ? wallTime(i.resolved) : i.status === "escalated" ? "A specialist is looking" : "Not yet", i.status === "resolved"],
    ["scale", "Time award", i.award ? `+${i.award.minutes} min decided` : i.status === "resolved" ? "Jury reviewing" : "After resolution", !!i.award],
  ];
  const cur = steps.findIndex((s) => !s[3]);
  return `<ol class="grid grid-cols-4 gap-3">${steps.map(([ic, l, sub, done], n) => `<li><div class="flex items-center gap-2"><span class="size-8 rounded-full grid place-items-center shrink-0 ${done ? "bg-primary text-primary-foreground" : n === cur ? "border-2 border-primary" : "border border-border text-muted-foreground"}"><i data-lucide="${done ? "check" : ic}" style="width:15px"></i></span><span class="h-0.5 flex-1 rounded ${n === 3 ? "hidden" : done ? "bg-primary" : "bg-border"}"></span></div><div class="mt-2 text-sm font-medium ${done || n === cur ? "" : "text-muted-foreground"}">${l}</div><div class="text-xs text-muted-foreground">${sub}</div></li>`).join("")}</ol>`;
}

function headline(i) {
  return { open: "Your report is in the queue. A helper will come to Table 4.", claimed: `${i.owner?.split(" ")[0]} is handling your report.`, escalated: "A specialist is looking at your report.", resolved: "This issue is resolved." }[i.status];
}

function detail(i) {
  const pub = (DATA.history[i.id] ?? []).filter((h) => h.t !== "internal");
  const imgs = (DATA.images[i.id] ?? []).filter((m) => m.vis === "public");
  const resolve = pub.find((h) => h.t === "resolve");
  return `<div class="max-w-4xl mx-auto p-8 space-y-6">
    <div><div class="flex items-center gap-2 text-sm text-muted-foreground"><span class="font-mono">ISS-${i.number}</span>·<span>${i.category}</span>·<span>sent ${wallTime(i.created)}</span></div>
    <h1 class="text-2xl font-semibold tracking-tight mt-1">${headline(i)}</h1></div>
    <section class="rounded-xl border border-border bg-card p-6"><div class="flex items-start gap-6"><div class="flex-1"><div class="text-xs text-muted-foreground">Your report</div><p class="mt-1 text-[15px]">${esc(i.description)}</p></div><div class="text-right"><div class="text-xs text-muted-foreground flex items-center gap-1.5 justify-end">${i.status !== "resolved" ? `<span class="size-1.5 rounded-full bg-emerald-500 animate-pulse"></span>Unresolved time` : "Total unresolved time"}</div><div class="font-mono text-4xl font-semibold tabular-nums" data-timer="${i.id}">${clock(elapsedMs(i))}</div></div></div>
      <div class="mt-6 pt-6 border-t border-border">${tracker(i)}</div></section>
    ${resolve ? `<section class="rounded-xl border border-emerald-500/40 bg-emerald-500/5 p-5"><div class="flex items-center gap-2 text-sm s-resolved font-medium"><i data-lucide="circle-check"></i>Resolution</div><p class="mt-1 text-lg font-medium">${esc(resolve.text)}</p><p class="text-xs text-muted-foreground mt-1">${resolve.who} · ${wallTime(resolve.at)}</p>
      <details class="mt-4 group"><summary class="text-sm text-muted-foreground cursor-pointer hover:text-foreground list-none flex items-center gap-1.5"><i data-lucide="rotate-ccw" style="width:14px"></i>The problem is back? Reopen this issue</summary><div class="mt-3 flex gap-2"><input class="field flex-1" placeholder="Tell staff what is still wrong"><button class="btn btn-outline">Reopen</button></div><p class="text-xs text-muted-foreground mt-1.5">The same helper stays responsible. The timer continues from where it stopped.</p></details></section>` : ""}
    ${i.award ? `<section class="rounded-xl border border-border bg-card p-5 grid grid-cols-[auto_1fr] gap-5 items-center"><div class="text-center px-4"><div class="text-4xl font-bold tabular-nums">+${i.award.minutes}</div><div class="text-xs text-muted-foreground">minutes</div></div><div><div class="font-medium">Time award</div><p class="text-sm text-muted-foreground">${esc(i.award.explanation)}</p><div class="flex gap-4 mt-3 text-xs"><span class="flex items-center gap-1.5 s-resolved"><i data-lucide="circle-check" style="width:14px"></i>Decided by the jury</span><span class="flex items-center gap-1.5 ${i.award.applied ? "s-resolved" : "text-muted-foreground"}"><i data-lucide="${i.award.applied ? "circle-check" : "circle-dashed"}" style="width:14px"></i>${i.award.applied ? "Applied to your contest time" : "Not yet applied to your contest time"}</span></div></div></section>` : ""}
    <section class="rounded-xl border border-border bg-card"><div class="px-5 py-4 border-b border-border flex items-center"><h2 class="font-semibold">Messages</h2><span class="ml-2 text-xs text-muted-foreground">Staff and your team</span></div>
      <div class="p-5 space-y-4">${pub.map((h) => h.t === "public" ? (h.who === "Team Aurora" ? `<div class="flex justify-end"><div class="max-w-[70%] rounded-2xl rounded-br-md bg-primary text-primary-foreground px-4 py-2.5"><div class="text-xs opacity-70">You · ${wallTime(h.at)}</div><div class="text-sm">${esc(h.text)}</div></div></div>` : `<div class="flex gap-3"><span class="size-8 rounded-full bg-muted grid place-items-center text-[11px] font-semibold shrink-0">${initials(h.who)}</span><div class="max-w-[70%] rounded-2xl rounded-bl-md border border-border px-4 py-2.5"><div class="text-xs text-muted-foreground">${h.who} · Staff · ${wallTime(h.at)}</div><div class="text-sm">${esc(h.text)}</div></div></div>`) : `<div class="flex items-center gap-3 text-xs text-muted-foreground"><span class="h-px flex-1 bg-border"></span>${esc(h.text.replace("Team Aurora", "you"))} · ${wallTime(h.at)}<span class="h-px flex-1 bg-border"></span></div>`).join("")}</div>
      ${imgs.length ? `<div class="px-5 pb-5"><div class="text-xs text-muted-foreground mb-2">Images from staff</div><div class="flex gap-2">${imgs.map((m) => `<div class="w-28 aspect-[4/3] rounded-lg" style="background:linear-gradient(135deg,hsl(${m.hue} 60% 55%),hsl(${m.hue + 40} 60% 35%))"></div>`).join("")}</div></div>` : ""}
      ${i.status !== "resolved" ? `<div class="p-4 border-t border-border flex gap-2"><input class="field flex-1" placeholder="Add details for staff…"><button class="btn btn-primary h-10"><i data-lucide="send"></i>Send</button></div>` : ""}</section>
  </div>`;
}

function newReport() {
  return `<div class="max-w-3xl mx-auto p-8"><h1 class="text-2xl font-semibold tracking-tight">Report an issue</h1><p class="text-muted-foreground mt-1">A helper will come to <b class="text-foreground">Hall A · Table 4</b>. Your unresolved time starts when you send this report.</p>
    ${intakeOpen ? "" : `<div class="mt-4 rounded-lg border border-amber-500/40 bg-amber-500/10 p-4 text-sm flex gap-3"><i data-lucide="circle-pause" class="s-escalated"></i><div><b>Reporting is closed.</b> The organisers closed new reports for this session. Raise your hand if you need help now.</div></div>`}
    <fieldset ${intakeOpen ? "" : "disabled class='opacity-50'"}><div class="mt-6 text-sm font-medium">What kind of problem?</div><div class="grid grid-cols-3 gap-3 mt-2">${DATA.session.categories.map((c, n) => `<label class="tile rounded-xl border border-border p-4 cursor-pointer hover:bg-accent/50"><input type="radio" name="cat" class="sr-only" ${n === cat ? "checked" : ""} data-cat="${n}"><i data-lucide="${CAT_ICONS[n]}"></i><div class="font-medium mt-2">${c}</div><div class="text-xs text-muted-foreground">${CAT_HELP[n]}</div></label>`).join("")}</div>
    <label class="block mt-6"><span class="text-sm font-medium">What is happening?</span><textarea class="field mt-2 min-h-32" maxlength="2000" placeholder="For example: the keyboard stopped working after the IDE froze. The mouse still works."></textarea></label>
    <div class="flex items-center justify-between mt-4"><span class="text-xs text-muted-foreground">Staff can see your report and reply here. Do not include solution code.</span><div class="flex gap-2"><button class="btn btn-outline" data-sel="${MINE[0].id}">Cancel</button><button class="btn btn-primary"><i data-lucide="send"></i>Send report</button></div></div></fieldset></div>`;
}

function render() {
  list();
  $("#main").innerHTML = sel === "new" ? newReport() : detail(MINE.find((i) => i.id === sel));
  lucide.createIcons();
}
document.addEventListener("click", (e) => {
  const g = (s) => e.target.closest(s);
  if (g("[data-sel]")) sel = g("[data-sel]").dataset.sel;
  else if (g("[data-new]")) sel = "new";
  else if (g("#intake")) { intakeOpen = !intakeOpen; $("#intake").setAttribute("aria-checked", intakeOpen); }
  else if (g("#theme")) { document.documentElement.classList.toggle("dark"); return; }
  else return;
  render();
});
document.addEventListener("change", (e) => { if (e.target.dataset.cat) cat = Number(e.target.dataset.cat); });
setInterval(() => document.querySelectorAll("[data-timer]").forEach((n) => { n.textContent = clock(elapsedMs(MINE.find((x) => x.id === n.dataset.timer))); }), 1000);
render();
</script>
</body>
</html>
